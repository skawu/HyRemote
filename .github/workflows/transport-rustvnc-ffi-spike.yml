name: transport-rustvnc-ffi-spike

on:
  pull_request:
    paths:
      - "spikes/vnc-transport-rust-ffi/**"
      - ".github/workflows/transport-rustvnc-ffi-spike.yml"
  workflow_dispatch:

jobs:
  ffi-smoke:
    name: ffi-smoke-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.90.0
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Select Rust 1.90.0
        run: rustup override set 1.90.0

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          cmake --version

      - name: Build Rust C ABI shim
        run: cargo build --manifest-path spikes/vnc-transport-rust-ffi/shim/Cargo.toml --release

      - name: Configure C++ smoke consumer
        run: cmake -S spikes/vnc-transport-rust-ffi/consumer -B build/transport-rustvnc-ffi -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ smoke consumer
        run: cmake --build build/transport-rustvnc-ffi --config Release

      - name: Run Linux ABI/lifecycle smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/transport-rustvnc-ffi/hyremote_vnc_ffi_smoke \
            ./spikes/vnc-transport-rust-ffi/shim/target/release/libhyremote_vnc_rust_ffi_probe.so

      - name: Run Windows ABI/lifecycle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/transport-rustvnc-ffi -Filter hyremote_vnc_ffi_smoke.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "C++ smoke executable not found" }
          $dll = Resolve-Path "spikes/vnc-transport-rust-ffi/shim/target/release/hyremote_vnc_rust_ffi_probe.dll"
          & $exe.FullName $dll.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
