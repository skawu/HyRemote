name: Mainline validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainline:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / Qt 6.8.3 / four frontends
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / Qt 6.8.3 / four frontends
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache the Qt installation
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.8.3-${{ matrix.aqt_arch }}-${{ runner.os }}-v1

      - name: Install exact Qt, Ninja and maintained viewer
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja 'vncdotool==1.3.0'
          # aqt reinstalls unconditionally and does not notice an existing installation, so a restored cache has to
          # short-circuit the download. Bump the key's -v1 suffix to force a fresh install after a Qt or module change.
          if [ "${{ steps.qt-cache.outputs.cache-hit }}" != "true" ]; then
            aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"
          fi

      - name: Install Linux QPA qualification dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/install-linux-qt-desktop-deps.sh qpa

      - name: Record exact merged commit
        shell: bash
        run: |
          echo "verified commit $(git rev-parse HEAD) $(git log -1 --pretty=%s)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Build, test and product-fit — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          sh ./compile.cmd \
            --integrations=cpp,qml,generic,qpa \
            --qt-prefix="$QT_PREFIX" \
            --build-dir=build-mainline \
            --tests --run-tests --no-examples \
            --xvfb --clean -j4 \
            --env=QT_QUICK_BACKEND=software

          LD_LIBRARY_PATH="$PWD/build-mainline/runtime:$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
            python src/integrations/cpp/tests/rfb_product_fit.py \
              build-mainline/integrations/cpp/tests/hyremote-rfb-test-server

      - name: Build, test and product-fit — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          call compile.cmd --integrations=cpp,qml,generic,qpa --qt-prefix="%QT_PREFIX%" --build-dir=build-mainline --tests --run-tests --no-examples --clean -j4
          set "PATH=%QT_PREFIX%\bin;%CD%\build-mainline\runtime;%PATH%"
          python src\integrations\cpp\tests\rfb_product_fit.py build-mainline\integrations\cpp\tests\hyremote-rfb-test-server.exe
