name: V1 GA acceptance

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/core/**'
      - 'src/remoteaccess/**'
      - 'integrations/qml/**'
      - 'integrations/qpa/**'
      - 'examples/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/scripts/install-linux-qt-desktop-deps.sh'
      - '.github/workflows/v1-ga-acceptance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-ga-candidate:
    if: >-
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'develop' || github.head_ref == 'release/v1.0.0.0')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name != 'release/v0.0.1.0' &&
       github.ref_name != 'release/v0.0.2.0' &&
       github.ref_name != 'release/v0.0.3.0')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / Qt 6.8.3 / all V1 modes
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / Qt 6.8.3 / all V1 modes (Xvfb correctness scope)
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Qt, Ninja and maintained viewer
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja 'vncdotool==1.3.0' Pillow
          aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"

      - name: Install Linux Qt desktop host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/install-linux-qt-desktop-deps.sh

      - name: Configure and build single release-like tree — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S . -B build-ga -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/staged-sdk" \
            -DHYREMOTE_BUILD_QML_API=ON \
            -DHYREMOTE_BUILD_TESTS=ON \
            -DHYREMOTE_BUILD_EXAMPLES=ON \
            -DHYREMOTE_WITH_QPA_PROXY=ON
          cmake --build build-ga --parallel
          test -f build-ga/core/libhyremote-core.a
          test -f build-ga/remoteaccess/libHyRemoteRemoteAccess.so
          test -f build-ga/plugins/platforms/libqhyremote.so

      - name: Full deterministic CTest — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          LD_LIBRARY_PATH="$PWD/build-ga/remoteaccess:$PWD/build-ga/qml/HyRemote:$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
            xvfb-run -a ctest --test-dir build-ga --output-on-failure | tee ga-ctest.log

      - name: RFB correctness and product E2E — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          export LD_LIBRARY_PATH="$PWD/build-ga/remoteaccess:$PWD/build-ga/qml/HyRemote:$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          python src/remoteaccess/tests/rfb_product_fit.py \
            build-ga/remoteaccess/tests/hyremote-rfb-test-server | tee ga-rfb-product-fit.log
          python tests/product-e2e/example_product_fit.py \
            --widgets build-ga/examples/widgets-basic/hyremote-widgets-basic \
            --quick build-ga/examples/quick-basic/hyremote-quick-basic | tee ga-e1-e2.log
          python tests/product-e2e/qml_product_fit.py \
            --qml build-ga/examples/qml-basic/hyremote-qml-basic | tee ga-e3.log
          python tests/product-e2e/showcase_product_fit.py \
            --showcase build-ga/examples/remote-support-showcase/hyremote-remote-support-showcase | tee ga-e5.log

      - name: Install integrated SDK and assert public package — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build-ga
          test -f "$PWD/staged-sdk/lib/libHyRemoteRemoteAccess.so"
          test -f "$PWD/staged-sdk/lib/HyRemote/plugins/platforms/libqhyremote.so"
          test -z "$(find "$PWD/staged-sdk/lib" -maxdepth 1 -type f -name 'libhyremote-core*' -print -quit)"

      - name: Public API and deployed C++ source QML consumers — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          PREFIX="$QT_PREFIX;$PWD/staged-sdk"
          cmake -S tests/public-api-contract -B consumer-public-api -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX"
          cmake --build consumer-public-api --parallel
          LD_LIBRARY_PATH="$PWD/staged-sdk/lib:$QT_PREFIX/lib" \
            ./consumer-public-api/hyremote-public-api-contract

          cmake -S tests/consumer-installed-sdk -B consumer-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/consumer-installed-install"
          cmake --build consumer-installed --parallel
          cmake --install consumer-installed
          test -f "$PWD/consumer-installed-install/bin/hyremote-installed-consumer"
          test -f "$PWD/consumer-installed-install/lib/libHyRemoteRemoteAccess.so"
          env -u LD_LIBRARY_PATH "$PWD/consumer-installed-install/bin/hyremote-installed-consumer"

          cmake -S tests/consumer-source -B consumer-source -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/consumer-source-install" \
            -DHYREMOTE_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build consumer-source --parallel
          cmake --install consumer-source
          test -f "$PWD/consumer-source-install/bin/hyremote-source-consumer"
          test -f "$PWD/consumer-source-install/lib/libHyRemoteRemoteAccess.so"
          env -u LD_LIBRARY_PATH "$PWD/consumer-source-install/bin/hyremote-source-consumer"

          cmake -S tests/consumer-installed-qml -B consumer-qml -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/consumer-qml-install"
          cmake --build consumer-qml --parallel
          cmake --install consumer-qml
          test -f "$PWD/consumer-qml-install/qml/HyRemote/qmldir"
          test -f "$PWD/consumer-qml-install/lib/libHyRemoteRemoteAccess.so"
          env -u LD_LIBRARY_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$PWD/consumer-qml-install/bin/hyremote-installed-qml-consumer"

      - name: Installed QPA consumer — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S tests/consumer-installed-qpa -B consumer-qpa -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$PWD/staged-sdk" \
            -DCMAKE_INSTALL_PREFIX="$PWD/consumer-qpa-install"
          cmake --build consumer-qpa --parallel
          cmake --install consumer-qpa
          test -f "$PWD/consumer-qpa-install/plugins/platforms/libqhyremote.so"
          test -f "$PWD/consumer-qpa-install/lib/libHyRemoteRemoteAccess.so"
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QT_QPA_PLATFORM \
            xvfb-run -a python tests/consumer-installed-qpa/product_fit.py \
              --app "$PWD/consumer-qpa-install/bin/hyremote-installed-qpa-consumer" \
              --port 5992 | tee ga-qpa-consumer.log

      - name: Installed combined QML + QPA consumer — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          PREFIX="$QT_PREFIX;$PWD/staged-sdk"
          cmake -S tests/consumer-installed-qml -B consumer-qml-qpa -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/consumer-qml-qpa-install" \
            -DHYREMOTE_CONSUMER_WITH_QPA=ON
          cmake --build consumer-qml-qpa --parallel
          cmake --install consumer-qml-qpa
          test -f "$PWD/consumer-qml-qpa-install/qml/HyRemote/qmldir"
          test -f "$PWD/consumer-qml-qpa-install/plugins/platforms/libqhyremote.so"
          test -f "$PWD/consumer-qml-qpa-install/lib/libHyRemoteRemoteAccess.so"
          env -u LD_LIBRARY_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
              -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QT_QPA_PLATFORM \
            xvfb-run -a python tests/consumer-installed-qpa/product_fit.py \
              --app "$PWD/consumer-qml-qpa-install/bin/hyremote-installed-qml-consumer" \
              --port 5993 | tee ga-qml-qpa-consumer.log

      - name: Configure build and CTest — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S . -B build-ga -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\staged-sdk" ^
            -DHYREMOTE_BUILD_QML_API=ON ^
            -DHYREMOTE_BUILD_TESTS=ON ^
            -DHYREMOTE_BUILD_EXAMPLES=ON ^
            -DHYREMOTE_WITH_QPA_PROXY=ON
          cmake --build build-ga --parallel
          if not exist "%CD%\build-ga\core\hyremote-core.lib" exit /b 1
          if not exist "%CD%\build-ga\remoteaccess\HyRemoteRemoteAccess.dll" exit /b 1
          if not exist "%CD%\build-ga\plugins\platforms\qhyremote.dll" exit /b 1
          set "PATH=%CD%\build-ga\remoteaccess;%CD%\build-ga\qml\HyRemote;%QT_PREFIX%\bin;%PATH%"
          ctest --test-dir build-ga --output-on-failure > ga-ctest.log 2>&1 || (type ga-ctest.log & exit /b 1)
          type ga-ctest.log

      - name: RFB correctness and product E2E — Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%CD%\build-ga\remoteaccess;%CD%\build-ga\qml\HyRemote;%QT_PREFIX%\bin;%PATH%"
          python src\remoteaccess\tests\rfb_product_fit.py build-ga\remoteaccess\tests\hyremote-rfb-test-server.exe > ga-rfb-product-fit.log 2>&1 || (type ga-rfb-product-fit.log & exit /b 1)
          type ga-rfb-product-fit.log
          python tests\product-e2e\example_product_fit.py ^
            --widgets build-ga\examples\widgets-basic\hyremote-widgets-basic.exe ^
            --quick build-ga\examples\quick-basic\hyremote-quick-basic.exe > ga-e1-e2.log 2>&1 || (type ga-e1-e2.log & exit /b 1)
          type ga-e1-e2.log
          python tests\product-e2e\qml_product_fit.py ^
            --qml build-ga\examples\qml-basic\hyremote-qml-basic.exe > ga-e3.log 2>&1 || (type ga-e3.log & exit /b 1)
          type ga-e3.log
          python tests\product-e2e\showcase_product_fit.py ^
            --showcase build-ga\examples\remote-support-showcase\hyremote-remote-support-showcase.exe > ga-e5.log 2>&1 || (type ga-e5.log & exit /b 1)
          type ga-e5.log

      - name: Install SDK and validate deployed C++ source QML consumers — Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PREFIX=%QT_PREFIX%;%CD%\staged-sdk"
          set "BUILD_PATH=%PATH%"
          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake --install build-ga
          if not exist "%CD%\staged-sdk\bin\HyRemoteRemoteAccess.dll" exit /b 1
          if exist "%CD%\staged-sdk\lib\hyremote-core.lib" exit /b 1
          if not exist "%CD%\staged-sdk\lib\HyRemote\plugins\platforms\qhyremote.dll" exit /b 1

          cmake -S tests\public-api-contract -B consumer-public-api -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%PREFIX%"
          cmake --build consumer-public-api --parallel
          set "PATH=%CD%\staged-sdk\bin;%QT_PREFIX%\bin;%BUILD_PATH%"
          consumer-public-api\hyremote-public-api-contract.exe

          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\consumer-installed-sdk -B consumer-installed -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\consumer-installed-install"
          cmake --build consumer-installed --parallel
          cmake --install consumer-installed
          if not exist "%CD%\consumer-installed-install\bin\hyremote-installed-consumer.exe" exit /b 1
          if not exist "%CD%\consumer-installed-install\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "PATH=%CD%\consumer-installed-install\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\consumer-installed-install\bin\hyremote-installed-consumer.exe"

          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\consumer-source -B consumer-source -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\consumer-source-install" ^
            -DHYREMOTE_SOURCE_DIR="%GITHUB_WORKSPACE%"
          cmake --build consumer-source --parallel
          cmake --install consumer-source
          if not exist "%CD%\consumer-source-install\bin\hyremote-source-consumer.exe" exit /b 1
          if not exist "%CD%\consumer-source-install\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "PATH=%CD%\consumer-source-install\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\consumer-source-install\bin\hyremote-source-consumer.exe"

          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\consumer-installed-qml -B consumer-qml -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\consumer-qml-install"
          cmake --build consumer-qml --parallel
          cmake --install consumer-qml
          if not exist "%CD%\consumer-qml-install\qml\HyRemote\qmldir" exit /b 1
          if not exist "%CD%\consumer-qml-install\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "QML2_IMPORT_PATH="
          set "QML_IMPORT_PATH="
          set "QT_QPA_PLATFORM=offscreen"
          set "PATH=%CD%\consumer-qml-install\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\consumer-qml-install\bin\hyremote-installed-qml-consumer.exe"

      - name: Installed QPA consumer — Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PYTHON_EXE=%pythonLocation%\python.exe"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          set "CMAKE_PREFIX_PATH=%QT_PREFIX%;%CD%\staged-sdk"
          cmake -S tests\consumer-installed-qpa -B consumer-qpa -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="%CD%\consumer-qpa-install"
          cmake --build consumer-qpa --parallel
          cmake --install consumer-qpa
          if not exist "%CD%\consumer-qpa-install\plugins\platforms\qhyremote.dll" exit /b 1
          if not exist "%CD%\consumer-qpa-install\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "QT_PLUGIN_PATH="
          set "QT_QPA_PLATFORM_PLUGIN_PATH="
          set "QT_QPA_PLATFORM="
          rem GA runtime proof must fail if the deployment omitted a Qt/HyRemote DLL; never inherit the Qt SDK bin path.
          set "PATH=%CD%\consumer-qpa-install\bin;%SystemRoot%\System32;%SystemRoot%"
          "%PYTHON_EXE%" tests\consumer-installed-qpa\product_fit.py ^
            --app "%CD%\consumer-qpa-install\bin\hyremote-installed-qpa-consumer.exe" ^
            --port 5992 > ga-qpa-consumer.log 2>&1 || (type ga-qpa-consumer.log & exit /b 1)
          type ga-qpa-consumer.log

      - name: Installed combined QML + QPA consumer — Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PYTHON_EXE=%pythonLocation%\python.exe"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          set "CMAKE_PREFIX_PATH=%QT_PREFIX%;%CD%\staged-sdk"
          cmake -S tests\consumer-installed-qml -B consumer-qml-qpa -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="%CD%\consumer-qml-qpa-install" ^
            -DHYREMOTE_CONSUMER_WITH_QPA=ON
          cmake --build consumer-qml-qpa --parallel
          cmake --install consumer-qml-qpa
          if not exist "%CD%\consumer-qml-qpa-install\qml\HyRemote\qmldir" exit /b 1
          if not exist "%CD%\consumer-qml-qpa-install\plugins\platforms\qhyremote.dll" exit /b 1
          if not exist "%CD%\consumer-qml-qpa-install\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "QML2_IMPORT_PATH="
          set "QML_IMPORT_PATH="
          set "QT_PLUGIN_PATH="
          set "QT_QPA_PLATFORM_PLUGIN_PATH="
          set "QT_QPA_PLATFORM="
          set "PATH=%CD%\consumer-qml-qpa-install\bin;%SystemRoot%\System32;%SystemRoot%"
          "%PYTHON_EXE%" tests\consumer-installed-qpa\product_fit.py ^
            --app "%CD%\consumer-qml-qpa-install\bin\hyremote-installed-qml-consumer.exe" ^
            --port 5993 > ga-qml-qpa-consumer.log 2>&1 || (type ga-qml-qpa-consumer.log & exit /b 1)
          type ga-qml-qpa-consumer.log

      - name: Upload GA diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-ga-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ga-*.log
            build-ga/Testing/Temporary/LastTest.log
            build-ga/Testing/Temporary/LastTestsFailed.log
