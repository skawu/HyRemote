name: PR review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# #1032: This is a REQUIRED status check. Cancelling one of several same-SHA
# pull_request_review_comment runs leaves a "p1-p2-disposition: cancelled"
# check in GitHub's protection decision, even after a later run succeeds.
# Several inline review events are normal for one Codex review. This short
# policy check must always complete and be observed on every event: no
# cancel-in-progress group and no stale-success shortcut.
jobs:
  p1-p2-disposition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/check_review_dispositions.py
          sparse-checkout-cone-mode: false
      - name: Require resolution or disposition for P1/P2 findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_review_dispositions.py
