name: CI

on:
  # Owner #573: run CI on a merge request, not on ordinary branch commits or after merge.
  # Drafts defer Qt until ready; updates to a ready PR invalidate the old CI result.
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      # Explicit FULL_GATE qualifies a frozen release SHA independently of the PR merge gate.
      # Normal development CI runs only on a PR; bare branch pushes never trigger it.
      #
      # #380: a dispatch is admitted, not generic. `purpose` says which decision this gate may produce and
      # `expected_sha` freezes the exact commit it claims to qualify. Both are checked fail-closed before any Qt
      # runner starts, so a branch-name dispatch can never be mistaken for stable candidate evidence and superseded
      # evidence is obvious.
      purpose:
        description: "Why this full gate runs (candidate | release-readiness | diagnostic)"
        required: true
        type: choice
        options:
          - candidate
          - release-readiness
          - diagnostic
      expected_sha:
        description: "Exact 40-hex commit SHA this gate must run on (must equal the dispatched commit)"
        required: true
        type: string
      legacy_dual_platform:
        description: "Historical v0.2.0.1 maintenance only: require Windows+Linux as originally shipped"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One PR's current SHA is authoritative. Superseded runs are cancelled when the
  # ready PR head changes; the replacement MUST pass before protected develop merges.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
      decision: ${{ steps.scope.outputs.decision }}
      purpose: ${{ steps.admission.outputs.purpose }}
      test_only: ${{ steps.scope.outputs.test_only }}
      product_matrix: ${{ steps.scope.outputs.product_matrix }}
      product: ${{ steps.scope.outputs.product }}
      # #393 TS-1: the Qt 5 lane builds C++/Widgets only, so it is selected by impact. The job mapping is required -
      # a missing entry here made the lane silently skip even though the classifier reported true.
      qt5_scope: ${{ steps.scope.outputs.qt5_scope }}
      integrations: ${{ steps.scope.outputs.integrations }}
      qpa: ${{ steps.scope.outputs.qpa }}
      qml: ${{ steps.scope.outputs.qml }}
      cpp: ${{ steps.scope.outputs.cpp }}
      generic_evidence: ${{ steps.scope.outputs.generic_evidence }}
      cpp_evidence: ${{ steps.scope.outputs.cpp_evidence }}
      qml_evidence: ${{ steps.scope.outputs.qml_evidence }}
      qpa_evidence: ${{ steps.scope.outputs.qpa_evidence }}
      readiness_evidence: ${{ steps.scope.outputs.readiness_evidence }}
      rfb_product_fit_evidence: ${{ steps.scope.outputs.rfb_product_fit_evidence }}
      tool_product_fit_evidence: ${{ steps.scope.outputs.tool_product_fit_evidence }}
      tool_installed_evidence: ${{ steps.scope.outputs.tool_installed_evidence }}
      governance: ${{ steps.scope.outputs.governance }}
      security_evidence: ${{ steps.scope.outputs.security_evidence }}
      test_exclude: ${{ steps.scope.outputs.test_exclude }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: authority-changed
        name: Detect CI authority changes from the real diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          authority_changed=false
          range=""
          case "${EVENT_NAME}" in
            pull_request) range="${BASE_SHA}...${HEAD_REF_SHA}" ;;
            push)
              if [[ "${BEFORE_SHA}" =~ ^0+$ || -z "${BEFORE_SHA}" ]]; then
                range="${HEAD_REF_SHA}~1..${HEAD_REF_SHA}"
              else
                range="${BEFORE_SHA}..${HEAD_REF_SHA}"
              fi ;;
          esac
          if [[ -n "${range}" ]] && git diff --name-only "${range}" -- \
               .github/scripts/resolve-ci-scope.py .github/workflows/ci.yml | grep -q .; then
            authority_changed=true
          fi
          echo "CI authority changed: ${authority_changed}"
          echo "changed=${authority_changed}" >> "$GITHUB_OUTPUT"

      # #380: the classifier's self test is CI-authority evidence, not a per-event ritual. It runs when the
      # classifier or this workflow changed - computed above from the real diff, never by the classifier deciding for
      # itself - and on an admitted manual dispatch, which is rare and explicitly comprehensive. Ordinary pull
      # requests and sentinel pushes skip it; a classifier syntax/runtime failure still fails this job immediately
      # because the scope step below runs the classifier itself.
      - name: Self-test the CI scope classifier
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.authority-changed.outputs.changed == 'true'
        shell: bash
        run: python3 .github/scripts/resolve-ci-scope.py --self-test

      # #380: cheap admission for the manual full gate. It runs here, in the seconds-scale classify job, so a
      # malformed or mismatching SHA fails closed before a single Qt runner starts.
      - id: admission
        name: Admit the full gate (fail closed before any Qt runner)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PURPOSE: ${{ inputs.purpose }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          LEGACY_DUAL_PLATFORM: ${{ inputs.legacy_dual_platform }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "${PURPOSE}" in
            candidate|release-readiness|diagnostic) ;;
            *) echo "::error::purpose '${PURPOSE}' is not one of: candidate, release-readiness, diagnostic"; exit 1 ;;
          esac
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a 40-hex commit SHA; got '${EXPECTED_SHA}'"
            exit 1
          fi
          if [[ "${EXPECTED_SHA}" != "${DISPATCH_SHA}" ]]; then
            echo "::error::expected_sha ${EXPECTED_SHA} does not match the dispatched commit ${DISPATCH_SHA}." >&2
            echo "A full gate is only evidence for the exact SHA it admits; a moving ref produces superseded evidence." >&2
            exit 1
          fi
          if [[ "${LEGACY_DUAL_PLATFORM:-false}" == "true" ]]; then
            [[ "${PURPOSE}" == "release-readiness" ]] || { echo "::error::legacy dual platform is for release-readiness only"; exit 1; }
            case "${DISPATCH_REF}" in
              refs/heads/release/v0.2.0.1|refs/tags/v0.2.0.1) ;;
              *) echo "::error::legacy dual-platform full gate must target historical v0.2.0.1"; exit 1 ;;
            esac
          fi
          echo "purpose=${PURPOSE}" >> "$GITHUB_OUTPUT"
          echo "admitted full gate: purpose=${PURPOSE} sha=${DISPATCH_SHA} decision=CANDIDATE"
          {
            echo "## FULL_GATE admission"
            echo
            echo "- admitted purpose: ${PURPOSE}"
            echo "- exact SHA: ${DISPATCH_SHA}"
            echo "- decision: CANDIDATE"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: scope
        name: Resolve affected capabilities
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          LEGACY_DUAL_PLATFORM: ${{ inputs.legacy_dual_platform }}
        run: |
          python .github/scripts/resolve-ci-scope.py

  windows-qt5:
    name: Windows x86_64 / Qt 5.15.2 / C++ Widgets
    needs: classify
    if: >-
      needs.classify.outputs.product == 'true' &&
      needs.classify.outputs.qt5_scope == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The candidate product-fit test runs in this lane too, and it imports Pillow. Installing the viewer
      # tooling into whichever interpreter happens to be on PATH made the Full Gate fail with
      # "No module named 'PIL'" while the Qt 6 lane passed, because only that lane pinned the interpreter.
      - name: Pin the Python used by the candidate tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 5.15.2 and the candidate viewer tooling
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir "%RUNNER_TEMP%\Qt5"
          if errorlevel 1 exit /b 1
          echo %RUNNER_TEMP%\Qt5\5.15.2\msvc2019_64\bin>>%GITHUB_PATH%
          python -m pip install --disable-pip-version-check -r src/integrations/cpp/tests/candidate-test-requirements.txt
          python -c "import PIL, vncdotool; print('viewer tooling importable: Python', __import__('sys').version.split()[0])"

      - name: Build and test Qt5 C++/Widgets
        shell: cmd
        env:
          TEST_EXCLUDE: ${{ needs.classify.outputs.test_exclude }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call build.cmd build --mode=cpp --qt-prefix="%RUNNER_TEMP%\Qt5\5.15.2\msvc2019_64" --build-type=Release --build-dir=build-ci-qt5 --tests --run-tests --no-examples "--test-exclude=%TEST_EXCLUDE%" -j4

  product:
    name: ${{ matrix.name }} / ${{ needs.classify.outputs.integrations }} / Release
    needs: classify
    # A draft pull request has not asked for review, so it runs cheap governance only: Git Flow/topology, the
    # classifier self test and the release-authority policy scripts. Product jobs therefore require both an affected
    # capability and a ready pull request. Non-pull-request events keep their own lane semantics from the classifier.
    # Owner #563: Windows x86_64 is the only blocking product and FULL_GATE matrix platform.
    # Optional Linux diagnostics/user reports remain useful but cannot block PR, candidate, RC or GA.
    if: >-
      needs.classify.outputs.product == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.product_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - id: qt-cache
        name: Restore exact Qt SDK
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: hyremote-qt-v4-${{ runner.os }}-6.8.3-${{ matrix.aqt_arch }}

      - name: Validate or install exact Qt SDK
        shell: bash
        env:
          NEED_QML: ${{ needs.classify.outputs.qml }}
          NEED_QPA: ${{ needs.classify.outputs.qpa }}
        run: |
          set -euo pipefail
          echo "CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          QT_ROOT="${RUNNER_TEMP//\\//}/Qt"
          QT_PREFIX="$QT_ROOT/6.8.3/${{ matrix.qt_dir }}"
          case "${{ runner.os }}" in
            Linux) QT_PLATFORM=linux ;;
            *)     QT_PLATFORM=windows ;;
          esac

          qt_tree_valid() {
            python .github/scripts/validate-qt-sdk.py \
              --prefix "$QT_PREFIX" \
              --qt-version 6.8.3 \
              --platform "$QT_PLATFORM" \
              --need-qml "$NEED_QML" \
              --need-qpa "$NEED_QPA" \
              --cmake-components Qt6CoreConfig.cmake Qt6GuiConfig.cmake Qt6NetworkConfig.cmake \
                                 Qt6WidgetsConfig.cmake Qt6QuickConfig.cmake \
              --private-headers qguiapplication_p.h
          }

          if ! qt_tree_valid; then
            if [[ "${{ steps.qt-cache.outputs.cache-hit }}" == "true" ]]; then
              echo "Restored Qt cache failed integrity validation; rebuilding the local tree."
            else
              echo "Qt cache miss; installing exact SDK."
            fi
            rm -rf "$QT_ROOT"
            python -m pip install --disable-pip-version-check aqtinstall
            aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$QT_ROOT"
            qt_tree_valid || {
              echo "Fresh Qt installation failed integrity validation." >&2
              exit 1
            }
            echo "QT_TREE_REBUILT=true" >> "$GITHUB_ENV"
          else
            echo "QT_TREE_REBUILT=false" >> "$GITHUB_ENV"
          fi

          if ! command -v ninja >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check ninja
          fi
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"

      # Viewer-side tooling for the exact-candidate product fit, installed only when that test is part of this run: the
      # change that touches the product-fit lane runs it, and the exact-candidate full gate requires it. It is
      # candidate test tooling rather than a product dependency - it never enters a product package, an installed SDK
      # runtime manifest or any instruction to an ordinary user - and installing it here rather than on every pull
      # request keeps an external viewer out of the ordinary fast lane. A failure to install fails the run, because a
      # candidate that cannot execute its product fit must not report success.
      #
      # The interpreter is pinned first, so the tooling is installed into the same Python that the build system
      # resolves from PATH for the test command. Without that, a Windows runner can install into one interpreter and
      # run the test with another, which shows up as a viewer that is "installed" but cannot be imported.
      - name: Set up the candidate product-fit interpreter
        if: >-
          needs.classify.outputs.rfb_product_fit_evidence == 'true' ||
          needs.classify.outputs.tool_product_fit_evidence == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install candidate product-fit viewer tooling
        if: >-
          needs.classify.outputs.rfb_product_fit_evidence == 'true' ||
          needs.classify.outputs.tool_product_fit_evidence == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r src/integrations/cpp/tests/candidate-test-requirements.txt
          python -c "import PIL, vncdotool; print('viewer tooling importable: Python', __import__('sys').version.split()[0])"

      # The ordinary product matrix is security-off, so the VNC-auth tests are never compiled by it and a green
      # ordinary run is not evidence about them. When the classifier selects security-on evidence, the product job
      # provides OpenSSL the same way the TLS preflight already proves works on both reference platforms. This is
      # provisioning only: the preflight keeps its own PRE semantics, and no second security workflow is introduced.
      - name: Provide the OpenSSL backend runtime and development files — Linux
        if: runner.os == 'Linux' && needs.classify.outputs.security_evidence == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev
          echo "OPENSSL_ROOT_DIR=/usr" >> "$GITHUB_ENV"
          openssl version -a | head -2

      - name: Provide the OpenSSL backend runtime and development files — Windows
        if: runner.os == 'Windows' && needs.classify.outputs.security_evidence == 'true'
        shell: bash
        run: |
          set -euo pipefail
          QT_ROOT="${RUNNER_TEMP//\\//}/Qt"
          # The Qt SDK is often restored from cache, in which case the Qt step never installed the tooling.
          python -m pip install --disable-pip-version-check aqtinstall
          aqt install-tool "${{ matrix.aqt_host }}" desktop tools_opensslv3_x64 --outputdir "$QT_ROOT"
          OPENSSL_PREFIX="$QT_ROOT/Tools/OpenSSLv3/Win_x64"
          if [[ ! -d "$OPENSSL_PREFIX" ]]; then
            echo "the Qt OpenSSL tool component did not install where expected" >&2
            exit 1
          fi
          # Qt's plugin loader finds the DLLs through the loader path, so the runtime directory has to be on PATH for
          # the product process as well as for its children.
          echo "$OPENSSL_PREFIX/bin" >> "$GITHUB_PATH"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          # A Windows executable has no rpath, so Qt's own DLLs must be on PATH too.
          echo "$QT_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Install missing Linux Qt host dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          NEED_QPA: ${{ needs.classify.outputs.qpa }}
        run: |
          if [[ "$NEED_QPA" == "true" ]]; then
            bash .github/scripts/install-linux-qt-desktop-deps.sh qpa
          else
            bash .github/scripts/install-linux-qt-desktop-deps.sh public
          fi

      - name: Build and test through HyRemote build system — Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          INTEGRATIONS: ${{ needs.classify.outputs.integrations }}
          TEST_EXCLUDE: ${{ needs.classify.outputs.test_exclude }}
          SECURITY_EVIDENCE: ${{ needs.classify.outputs.security_evidence }}
          TOOL_PRODUCT_FIT_EVIDENCE: ${{ needs.classify.outputs.tool_product_fit_evidence }}
          TOOL_INSTALLED_EVIDENCE: ${{ needs.classify.outputs.tool_installed_evidence }}
        run: |
          set -euo pipefail
          # Ordinary builds stay security-off. Only a diff that can invalidate the VNC-auth/private-security path
          # makes this run request the capability, resolving OpenSSL from the prefix provisioned above. Everything
          # else - integration selection, exclusions, fail-closed checks and artifacts - is unchanged.
          security_args=()
          if [[ "$SECURITY_EVIDENCE" == "true" ]]; then
            security_args+=(--security "--cmake=OPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR}")
          fi
          examples_arg=--no-examples
          if [[ "$TOOL_PRODUCT_FIT_EVIDENCE" == "true" || "$TOOL_INSTALLED_EVIDENCE" == "true" ]]; then
            examples_arg=--examples
          fi
          sh ./build.cmd build \
            --integrations="$INTEGRATIONS" \
            --qt-prefix="$QT_PREFIX" \
            --build-type=Release \
            --build-dir=build-ci \
            --tests --run-tests "$examples_arg" \
            --test-exclude="$TEST_EXCLUDE" \
            --xvfb -j4 \
            --env=QT_QUICK_BACKEND=software \
            ${security_args[@]+"${security_args[@]}"}

      - name: Build and test through HyRemote build system — Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          INTEGRATIONS: ${{ needs.classify.outputs.integrations }}
          TEST_EXCLUDE: ${{ needs.classify.outputs.test_exclude }}
          SECURITY_EVIDENCE: ${{ needs.classify.outputs.security_evidence }}
          TOOL_PRODUCT_FIT_EVIDENCE: ${{ needs.classify.outputs.tool_product_fit_evidence }}
          TOOL_INSTALLED_EVIDENCE: ${{ needs.classify.outputs.tool_installed_evidence }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "SECURITY_ARG="
          if "%SECURITY_EVIDENCE%"=="true" set "SECURITY_ARG=--security --cmake=OPENSSL_ROOT_DIR=%OPENSSL_ROOT_DIR%"
          set "EXAMPLES_ARG=--no-examples"
          if "%TOOL_PRODUCT_FIT_EVIDENCE%"=="true" set "EXAMPLES_ARG=--examples"
           if "%TOOL_INSTALLED_EVIDENCE%"=="true" set "EXAMPLES_ARG=--examples"
          call build.cmd build --integrations="%INTEGRATIONS%" --qt-prefix="%QT_PREFIX%" --build-type=Release --build-dir=build-ci --tests --run-tests %EXAMPLES_ARG% "--test-exclude=%TEST_EXCLUDE%" %SECURITY_ARG% -j4

      # The lane proves the deployment path, not only the build path: the same canonical entry point runs one bounded
      # install that reuses the build tree the step above produced, so nothing is recompiled and the run states the
      # install phase's own progress and the root it deployed into. This is the command a developer runs, not a
      # second install mechanism. Linux platform qualification is optional per Owner #563.
      - name: Canonical install through HyRemote build system — Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          INTEGRATIONS: ${{ needs.classify.outputs.integrations }}
          SECURITY_EVIDENCE: ${{ needs.classify.outputs.security_evidence }}
          TOOL_PRODUCT_FIT_EVIDENCE: ${{ needs.classify.outputs.tool_product_fit_evidence }}
          TOOL_INSTALLED_EVIDENCE: ${{ needs.classify.outputs.tool_installed_evidence }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "SECURITY_ARG="
          if "%SECURITY_EVIDENCE%"=="true" set "SECURITY_ARG=--security --cmake=OPENSSL_ROOT_DIR=%OPENSSL_ROOT_DIR%"
          set "EXAMPLES_ARG=--no-examples"
          if "%TOOL_PRODUCT_FIT_EVIDENCE%"=="true" set "EXAMPLES_ARG=--examples"
           if "%TOOL_INSTALLED_EVIDENCE%"=="true" set "EXAMPLES_ARG=--examples"
          call build.cmd install --integrations="%INTEGRATIONS%" --qt-prefix="%QT_PREFIX%" --build-type=Release --build-dir=build-ci --tests %EXAMPLES_ARG% %SECURITY_ARG% -j4

      - name: Test evidence summary
        if: always()
        shell: bash
        env:
          # The summary has to report the exclusion this run actually used, and the guard below has to be able to
          # fire. Without this the report printed "<empty>" for every run and the all-matching-shape check could
          # never trigger, which is a guard in name only.
          TEST_EXCLUDE: ${{ needs.classify.outputs.test_exclude }}
          SECURITY_EVIDENCE: ${{ needs.classify.outputs.security_evidence }}
        run: |
          set -uo pipefail
          LOG=build-ci/test.log
          status=0
          {
            echo "## Test evidence — ${{ matrix.name }}"
            echo
            echo "TEST_EXCLUDE=${TEST_EXCLUDE:-<empty>}"
            # The VNC-auth tests only exist when the product actually resolved security, so the run records the
            # classifier's decision next to the counts it produced.
            echo "SECURITY_EVIDENCE=${SECURITY_EVIDENCE:-<false>}"
            if [[ ! -f "$LOG" ]]; then
              echo "No \`$LOG\` was produced, so the test phase never ran (build/configuration failure)."
              exit 0
            fi
            echo "### CTest summary"
            echo '```text'
            grep -E "[0-9]+% tests passed|Total Test time" "$LOG" || true
            echo '```'
            echo
            echo "### Failed tests"
            echo '```text'
            sed -n '/The following tests FAILED/,$p' "$LOG" || true
            echo '```'
            echo
            # A lane that claims to be integration has to show real tests. This reads the run's own result line
            # rather than trusting the job status: "No tests were found!!!" with a zero count is exactly the false
            # green that let the release-readiness gates stay unexecuted, and it exits zero.
            executed="$(grep -oE 'out of [0-9]+' "$LOG" | head -1 | grep -oE '[0-9]+' || true)"
            executed="${executed:-0}"
            echo "EXECUTED_TEST_COUNT=$executed"
            if [[ "$executed" -eq 0 ]] || grep -q "No tests were found" "$LOG"; then
              echo "::error::${{ matrix.name }} executed $executed test(s); the log shows no real test execution"
              status=1
            fi
            # An exclusion that matches every test name would empty the suite silently, so it is refused here as
            # well as in the classifier, where the same shape is proved impossible by an executable self test.
            if [[ "${TEST_EXCLUDE:-}" == "^()" ]]; then
              echo "::error::test_exclude is '$TEST_EXCLUDE', which excludes every test"
              status=1
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Artifacts exist to support a decision: a failure, the clean SDK/deploy acceptance contracts this run was
      # asked to prove, or the explicit full gate. An ordinary ready pull request that proves neither does not
      # produce a build-evidence bundle for nothing.
      - name: Upload diagnostic evidence
        if: >-
          failure() ||
          needs.classify.outputs.generic_evidence == 'true' ||
          needs.classify.outputs.cpp_evidence == 'true' ||
          needs.classify.outputs.qml_evidence == 'true' ||
          needs.classify.outputs.qpa_evidence == 'true' ||
          needs.classify.outputs.tool_installed_evidence == 'true' ||
          needs.classify.outputs.security_evidence == 'true' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hyremote-test-log-${{ runner.os }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build-ci/test.log
            build-ci/evidence/*/summary.txt
            build-ci/evidence/*/*/evidence.txt
            build-ci/evidence/**/*.log

      # PR-created caches live under refs/pull/.../merge and cannot seed sibling PRs. The trusted develop/manual
      # lanes own the reusable baseline cache; PRs consume that cache or perform a one-off fallback install.
      - name: Save verified exact Qt SDK
        if: always() && github.event_name != 'pull_request' && steps.qt-cache.outputs.cache-hit != 'true' && env.QT_TREE_REBUILT == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: hyremote-qt-v4-${{ runner.os }}-6.8.3-${{ matrix.aqt_arch }}

      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"
          start="${CI_STARTED:-$now}"
          {
            echo "## CI timing"
            echo
            echo "- runner: ${{ matrix.name }}"
            echo "- integrations: ${{ needs.classify.outputs.integrations }}"
            echo "- Qt cache hit: ${{ steps.qt-cache.outputs.cache-hit }}"
            echo "- elapsed after environment start: $((now-start))s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Release-authority governance needs no Qt SDK, no Windows runner and no product build: it is CMake policy and
  # selection over the repository itself. Running two full Qt runners just to execute a policy script was the most
  # expensive way to answer a question that a five-second job answers, so the governance lane is separate and the
  # classifier reports governance and product independently.
  authority-governance:
    name: Release-authority governance (no Qt)
    needs: classify
    if: needs.classify.outputs.governance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Self-test release-train selection
        shell: bash
        run: |
          set -euo pipefail
          cmake -DHYREMOTE_SOURCE_DIR="$PWD" -DHYREMOTE_SCOPE_SELF_TEST=ON \
            -P tests/release-readiness/release_scope.cmake

      - name: Release authority policy gate
        shell: bash
        run: |
          set -euo pipefail
          cmake -DHYREMOTE_SOURCE_DIR="$PWD" \
            -P tests/release-readiness/check_release_authority_policy.cmake

      # A01/E01: the exact-cell matrix is a product statement made in tracked text, so the same cheap lane
      # executes its guard whenever any document it reads changes. No Qt SDK, no product build.
      - name: Compatibility cell matrix guard
        shell: bash
        run: |
          set -euo pipefail
          cmake -DHYREMOTE_SOURCE_DIR="$PWD" \
            -P tests/release-readiness/check_compatibility_cells.cmake

      # E02/#602: every inherited V1 mandatory child stays accounted for while the machine list is reconciled.
      - name: GA scope reconciliation guard
        shell: bash
        run: |
          set -euo pipefail
          cmake -DHYREMOTE_SOURCE_DIR="$PWD" \
            -P tests/release-readiness/check_ga_scope_reconciliation.cmake

  no-product-change:
    # #380: this is a decision report, not an acceptance run. Its name has to say that no hosted product validation
    # was required, so nobody reads a green checkmark here as "the product gate ran".
    name: "CI decision: no hosted product validation required"
    needs: classify
    if: needs.classify.outputs.product != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Report the lane and the decision
        run: |
          echo "lane=${{ needs.classify.outputs.lane }}"
          echo "decision=${{ needs.classify.outputs.decision }}"
          echo "capabilities=${{ needs.classify.outputs.integrations || 'none' }}"
          echo "governance=${{ needs.classify.outputs.governance }}"
          if [ "${{ needs.classify.outputs.lane }}" = "PR_FAST" ]; then
            echo "PR governance/docs-only: no affected product claim; Qt runners intentionally skipped; no product PASS claimed."
          else
            echo "No affected Qt product contract selected; the Qt runners are intentionally skipped."
          fi

  # Stable required status context to add to the protected develop branch ruleset.
  # Never allow skipped, cancelled or failing required Windows Qt jobs to look green.
  ci-merge-verdict:
    name: ci-merge-verdict
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    needs: [classify, product, windows-qt5, authority-governance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CLASSIFY: ${{ needs.classify.result }}
      PRODUCT_REQUIRED: ${{ needs.classify.outputs.product }}
      PRODUCT_RESULT: ${{ needs.product.result }}
      QT5_SELECTED: ${{ needs.classify.outputs.qt5_scope }}
      QT5_RESULT: ${{ needs.windows-qt5.result }}
      GOVERNANCE_REQUIRED: ${{ needs.classify.outputs.governance }}
      GOVERNANCE_RESULT: ${{ needs.authority-governance.result }}
      CLASSIFIED_LANE: ${{ needs.classify.outputs.lane }}
      EXPECTED_DECISION: ${{ needs.classify.outputs.decision }}
    steps:
      - name: Require all selected PR gates to pass (never green on skipped product)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY" == success ]] || { echo "::error::CI classification not successful: $CLASSIFY"; exit 1; }
          [[ "$CLASSIFIED_LANE" == PR_FAST && "$EXPECTED_DECISION" == MERGE ]] || {
            echo "::error::CI PR merge lane/decision invalid: $CLASSIFIED_LANE/$EXPECTED_DECISION"; exit 1; }
          if [[ "$PRODUCT_REQUIRED" == true ]]; then
            [[ "$PRODUCT_RESULT" == success ]] || { echo "::error::Required Windows Qt product tests did not pass: $PRODUCT_RESULT"; exit 1; }
            if [[ "$QT5_SELECTED" == true ]]; then
              [[ "$QT5_RESULT" == success ]] || { echo "::error::Required Windows Qt5 C++/Widgets lane did not pass: $QT5_RESULT"; exit 1; }
            else
              [[ "$QT5_RESULT" == skipped ]] || { echo "::error::Qt5 lane was not selected but did not skip: $QT5_RESULT"; exit 1; }
              echo "Qt5 lane not selected: the diff cannot reach the Core/Shared Runtime/C++/Widgets layer it builds."
            fi
          else
            [[ "$PRODUCT_RESULT" == skipped ]] || { echo "::error::Unexpected product result on no-product PR: $PRODUCT_RESULT"; exit 1; }
            [[ "$QT5_RESULT" == skipped ]] || { echo "::error::Unexpected Qt5 result on no-product PR: $QT5_RESULT"; exit 1; }
            echo "No product-affecting diff; no Qt tests required or implied."
          fi
          if [[ "$GOVERNANCE_REQUIRED" == true ]]; then
            [[ "$GOVERNANCE_RESULT" == success ]] || { echo "::error::Required governance tests failed/skipped: $GOVERNANCE_RESULT"; exit 1; }
          else
            [[ "$GOVERNANCE_RESULT" == skipped ]] || { echo "::error::Unexpected governance result: $GOVERNANCE_RESULT"; exit 1; }
          fi
          echo "PR CI acceptance PASS for the exact tested PR merge ref; all required selected jobs passed."
