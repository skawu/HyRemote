name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      product: ${{ steps.changes.outputs.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changes
        name: Decide whether product CI is required
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os, pathlib, subprocess

          if os.environ["EVENT_NAME"] == "pull_request":
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}"],
                  text=True,
              ).splitlines()
          else:
              changed = ["compile.cmd"]

          changed = [p.strip() for p in changed if p.strip()]
          product_roots = (
              "src/", "cmake/", "tests/", "examples/", ".github/scripts/", ".github/build/",
          )
          product_files = {"CMakeLists.txt", "compile.cmd", "build.yml", ".github/workflows/ci.yml"}
          product = any(
              path in product_files or any(path.startswith(prefix) for prefix in product_roots)
              for path in changed
          )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"product={'true' if product else 'false'}\n")

          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## CI change classification\n\n")
              f.write(f"- changed files: {len(changed)}\n")
              f.write(f"- product build: {'yes' if product else 'no (docs/governance only)'}\n")
              f.write("- build authority: `compile.cmd` + `.github/build/ci.yml`\n")

  product:
    name: ${{ matrix.os_name }} / Qt 6.8.3
    needs: classify
    if: needs.classify.outputs.product == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - os_name: Linux x86_64
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64
          - os_name: Windows x86_64
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: qt-cache
        name: Restore Qt SDK cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: hyremote-qt-v2-${{ runner.os }}-6.8.3-${{ matrix.aqt_arch }}

      - name: Install build tools and Qt on cache miss
        shell: bash
        run: |
          set -euo pipefail
          echo "CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check ninja
          if [[ "${{ steps.qt-cache.outputs.cache-hit }}" != "true" ]]; then
            python -m pip install --disable-pip-version-check aqtinstall
            aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"
          fi
          echo "QT_PREFIX=$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}" >> "$GITHUB_ENV"

      - name: Validate Qt SDK cache
        shell: bash
        run: |
          set -euo pipefail
          qt="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          test -f "$qt/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$qt/lib/cmake/Qt6Qml/Qt6QmlConfig.cmake"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f "$qt/qml/Qt/labs/platform/labsplatformplugind.dll"
          else
            test -f "$qt/lib/libQt6Core.so.6"
          fi

      - name: Save validated Qt SDK cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: hyremote-qt-v2-${{ runner.os }}-6.8.3-${{ matrix.aqt_arch }}

      - name: Install Linux Qt host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/install-linux-qt-desktop-deps.sh

      - name: Build and test through HyRemote build system — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sh ./compile.cmd \
            --config=.github/build/ci.yml \
            --qt-prefix="$QT_PREFIX" \
            -v

      - name: Build and test through HyRemote build system — Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call compile.cmd --config=.github/build/ci.yml --qt-prefix="%QT_PREFIX%" -v

      - name: CI timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"
          start="${CI_STARTED:-$now}"
          elapsed="$((now-start))"
          {
            echo "## CI timing"
            echo
            echo "- runner: ${{ matrix.os_name }}"
            echo "- Qt cache hit: ${{ steps.qt-cache.outputs.cache-hit }}"
            echo "- build entry: compile.cmd"
            echo "- build config: .github/build/ci.yml"
            echo "- integration payload: cpp + qml + generic + qpa"
            echo "- focused daily CI excludes release-readiness gates; SDK/GA/release own those checks"
            echo "- product job elapsed: ${elapsed}s"
            echo "- target budget: warm-cache PR job <= 12 minutes"
          } >> "$GITHUB_STEP_SUMMARY"

  no-product-change:
    name: No product CI needed
    needs: classify
    if: needs.classify.outputs.product != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Documentation/governance-only change; Qt build intentionally skipped."
