name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.changes.outputs.code }}
      qml: ${{ steps.changes.outputs.qml }}
      qpa: ${{ steps.changes.outputs.qpa }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changes
        name: Decide the smallest useful product build
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os, pathlib, subprocess

          if os.environ["EVENT_NAME"] == "pull_request":
              base = os.environ["BASE_SHA"]
              head = os.environ["HEAD_SHA"]
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...{head}"], text=True
              ).splitlines()
          else:
              changed = ["CMakeLists.txt"]

          changed = [p.strip() for p in changed if p.strip()]
          global_product = (
              "CMakeLists.txt",
              "cmake/",
              "src/core/",
              "src/runtime/",
              "tests/release-readiness/",
              ".github/workflows/ci.yml",
          )
          code_prefixes = (
              "src/", "cmake/", "tests/", "examples/", ".github/scripts/",
          )

          def starts(path, prefixes):
              return any(path == p or path.startswith(p) for p in prefixes)

          code = any(path == "CMakeLists.txt" or starts(path, code_prefixes) for path in changed)
          broad = any(path == "CMakeLists.txt" or starts(path, global_product) for path in changed)
          qml = broad or any(path.startswith("src/qml/") or path.startswith("examples/") for path in changed)
          qpa = broad or any(path.startswith("src/qpa/") or path.startswith("examples/") for path in changed)

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as f:
              f.write(f"code={'true' if code else 'false'}\n")
              f.write(f"qml={'ON' if qml else 'OFF'}\n")
              f.write(f"qpa={'ON' if qpa else 'OFF'}\n")

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as f:
              f.write("## CI change classification\n\n")
              f.write(f"- changed files: {len(changed)}\n")
              f.write(f"- product build: {'yes' if code else 'no (docs/governance only)'}\n")
              f.write(f"- QML payload: {'on' if qml else 'off'}\n")
              f.write(f"- QPA payload: {'on' if qpa else 'off'}\n")

  product:
    name: ${{ matrix.os_name }} / Qt 6.8.3
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - os_name: Linux x86_64
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64
          - os_name: Windows x86_64
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: qt-cache
        name: Restore Qt SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: hyremote-qt-${{ runner.os }}-6.8.3-${{ matrix.aqt_arch }}

      - name: Install build tools and Qt on cache miss
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ninja
          if [[ "${{ steps.qt-cache.outputs.cache-hit }}" != "true" ]]; then
            python -m pip install --disable-pip-version-check aqtinstall
            aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"
          fi
          echo "QT_PREFIX=$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}" >> "$GITHUB_ENV"
          echo "CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Linux Qt host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/install-linux-qt-desktop-deps.sh

      - name: Configure, build and test — Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHYREMOTE_BUILD_TESTS=ON \
            -DHYREMOTE_BUILD_EXAMPLES=OFF \
            -DHYREMOTE_BUILD_QML_API=${{ needs.classify.outputs.qml }} \
            -DHYREMOTE_WITH_QPA_PROXY=${{ needs.classify.outputs.qpa }}
          cmake --build build --parallel 4
          runtime_lib="$(find build -type f -name 'libHyRemoteRemoteAccess.so' -print -quit)"
          test -n "$runtime_lib"
          runtime_dir="$(dirname "$runtime_lib")"
          LD_LIBRARY_PATH="$runtime_dir:$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
            ctest --test-dir build --output-on-failure --parallel 4

      - name: Configure, build and test — Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DHYREMOTE_BUILD_TESTS=ON ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF ^
            -DHYREMOTE_BUILD_QML_API=${{ needs.classify.outputs.qml }} ^
            -DHYREMOTE_WITH_QPA_PROXY=${{ needs.classify.outputs.qpa }}
          cmake --build build --parallel 4

      - name: Locate shared runtime — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -Path build -Recurse -Filter HyRemoteRemoteAccess.dll | Select-Object -First 1
          if (-not $runtime) { throw 'HyRemoteRemoteAccess.dll was not produced' }
          "RUNTIME_DIR=$($runtime.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test — Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%RUNTIME_DIR%;%QT_PREFIX%\bin;%PATH%"
          ctest --test-dir build --output-on-failure --parallel 4

      - name: CI timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"
          start="${CI_STARTED:-$now}"
          elapsed="$((now-start))"
          {
            echo "## CI timing"
            echo
            echo "- runner: ${{ matrix.os_name }}"
            echo "- Qt cache hit: ${{ steps.qt-cache.outputs.cache-hit }}"
            echo "- QML payload: ${{ needs.classify.outputs.qml }}"
            echo "- QPA payload: ${{ needs.classify.outputs.qpa }}"
            echo "- product job elapsed: ${elapsed}s"
            echo "- target budget: warm-cache PR job <= 12 minutes"
          } >> "$GITHUB_STEP_SUMMARY"

  no-product-change:
    name: No product CI needed
    needs: classify
    if: needs.classify.outputs.code != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Documentation/governance-only change; Qt build intentionally skipped."
