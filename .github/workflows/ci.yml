name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      product: ${{ steps.scope.outputs.product }}
      integrations: ${{ steps.scope.outputs.integrations }}
      qpa: ${{ steps.scope.outputs.qpa }}
      qml: ${{ steps.scope.outputs.qml }}
      generic_evidence: ${{ steps.scope.outputs.generic_evidence }}
      build_type: ${{ steps.scope.outputs.build_type }}
      test_exclude: ${{ steps.scope.outputs.test_exclude }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Resolve affected capabilities
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os
          import subprocess

          event = os.environ["EVENT_NAME"]
          full_evidence = event != "pull_request"

          if event == "pull_request":
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}"],
                  text=True,
              ).splitlines()
          else:
              # develop pushes and manual dispatches are integration evidence, never a diff-minimized PR lane.
              changed = ["CMakeLists.txt"]

          peers = ["cpp", "qml", "generic", "qpa"]
          selected = set()

          common_files = {
              "CMakeLists.txt",
              "compile.cmd",
              "build.yml",
              ".github/workflows/ci.yml",
          }
          common_prefixes = (
              "src/core/",
              "src/runtime/",
              "cmake/",
              "tests/build-authority/",
              "tests/release-readiness/",
              ".github/scripts/",
          )
          frontend_prefixes = {
              "cpp": ("src/integrations/cpp/", "tests/consumer-installed-sdk/"),
              "qml": ("src/integrations/qml/", "tests/consumer-installed-qml/"),
              "generic": ("src/integrations/generic/", "tests/consumer-installed-generic/"),
              "qpa": ("src/integrations/qpa/", "tests/consumer-installed-qpa/"),
          }

          for path in changed:
              if path in common_files or path.startswith(common_prefixes):
                  selected.update(peers)
                  continue

              matched = False
              for peer, prefixes in frontend_prefixes.items():
                  if path.startswith(prefixes):
                      selected.add(peer)
                      matched = True
              if matched:
                  continue

              if path.startswith(("examples/", "tests/product-e2e/", "tests/public-api-contract/", "logo/")):
                  selected.update(peers)
              elif path.startswith("tests/"):
                  selected.update(peers)

          # The clean installed Generic consumers are product/release evidence, not a useful tax on every Runtime PR.
          # Run them when their contract can have changed, and on every develop/manual full integration run.
          generic_evidence_paths = (
              "src/integrations/generic/",
              "tests/consumer-installed-generic/",
              "cmake/HyRemoteDeploy.cmake",
              "cmake/HyRemoteInstall.cmake",
              "tests/release-readiness/run_release_evidence.cmake",
          )
          generic_evidence = full_evidence or any(
              path.startswith(generic_evidence_paths) for path in changed
          )

          ordered = [peer for peer in peers if peer in selected]
          integrations = ",".join(ordered)
          product = bool(ordered)

          # PRs are compile/correctness feedback and use Debug unless they are validating installed/deployment
          # evidence. develop/manual runs remain the Release integration proof.
          build_type = "Release" if (full_evidence or generic_evidence) else "Debug"
          if generic_evidence:
              test_exclude = "^hyremote-release-readiness-"
          else:
              test_exclude = "^(hyremote-release-readiness-|hyremote-generic-installed-consumers$)"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"product={'true' if product else 'false'}\n")
              f.write(f"integrations={integrations}\n")
              f.write(f"qpa={'true' if 'qpa' in selected else 'false'}\n")
              f.write(f"qml={'true' if 'qml' in selected else 'false'}\n")
              f.write(f"generic_evidence={'true' if generic_evidence else 'false'}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"test_exclude={test_exclude}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## CI scope\n\n")
              f.write(f"- changed files: {len(changed)}\n")
              f.write(f"- integrations: {integrations or 'none'}\n")
              f.write(f"- Qt build: {'yes' if product else 'no — documentation/governance only'}\n")
              f.write(f"- build type: {build_type}\n")
              f.write(f"- clean Generic evidence: {'yes' if generic_evidence else 'no'}\n")
              f.write(f"- lane: {'full integration' if full_evidence else 'PR fast'}\n")

  product:
    name: ${{ matrix.name }} / ${{ needs.classify.outputs.integrations }} / ${{ needs.classify.outputs.build_type }}
    needs: classify
    if: needs.classify.outputs.product == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 / Qt 6.8.3
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64
          - name: Windows x86_64 / Qt 6.8.3
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - id: qt-cache
        name: Restore exact Qt SDK
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: hyremote-qt-v4-${{ runner.os }}-6.8.3-${{ matrix.aqt_arch }}

      - name: Validate or install exact Qt SDK
        shell: bash
        env:
          NEED_QML: ${{ needs.classify.outputs.qml }}
          NEED_QPA: ${{ needs.classify.outputs.qpa }}
        run: |
          set -euo pipefail
          echo "CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          QT_ROOT="${RUNNER_TEMP//\\//}/Qt"
          QT_PREFIX="$QT_ROOT/6.8.3/${{ matrix.qt_dir }}"
          case "${{ runner.os }}" in
            Linux) QT_PLATFORM=linux ;;
            *)     QT_PLATFORM=windows ;;
          esac

          qt_tree_valid() {
            python .github/scripts/validate-qt-sdk.py \
              --prefix "$QT_PREFIX" \
              --qt-version 6.8.3 \
              --platform "$QT_PLATFORM" \
              --need-qml "$NEED_QML" \
              --need-qpa "$NEED_QPA" \
              --cmake-components Qt6CoreConfig.cmake Qt6GuiConfig.cmake Qt6NetworkConfig.cmake \
                                 Qt6WidgetsConfig.cmake Qt6QuickConfig.cmake \
              --private-headers qguiapplication_p.h
          }

          if ! qt_tree_valid; then
            if [[ "${{ steps.qt-cache.outputs.cache-hit }}" == "true" ]]; then
              echo "Restored Qt cache failed integrity validation; rebuilding the local tree."
            else
              echo "Qt cache miss; installing exact SDK."
            fi
            rm -rf "$QT_ROOT"
            python -m pip install --disable-pip-version-check aqtinstall
            aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$QT_ROOT"
            qt_tree_valid || {
              echo "Fresh Qt installation failed integrity validation." >&2
              exit 1
            }
            echo "QT_TREE_REBUILT=true" >> "$GITHUB_ENV"
          else
            echo "QT_TREE_REBUILT=false" >> "$GITHUB_ENV"
          fi

          if ! command -v ninja >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check ninja
          fi
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"

      - name: Install missing Linux Qt host dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          NEED_QPA: ${{ needs.classify.outputs.qpa }}
        run: |
          if [[ "$NEED_QPA" == "true" ]]; then
            bash .github/scripts/install-linux-qt-desktop-deps.sh qpa
          else
            bash .github/scripts/install-linux-qt-desktop-deps.sh public
          fi

      - name: Build and test through HyRemote build system — Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          INTEGRATIONS: ${{ needs.classify.outputs.integrations }}
          BUILD_TYPE: ${{ needs.classify.outputs.build_type }}
          TEST_EXCLUDE: ${{ needs.classify.outputs.test_exclude }}
        run: |
          set -euo pipefail
          sh ./compile.cmd \
            --integrations="$INTEGRATIONS" \
            --qt-prefix="$QT_PREFIX" \
            --build-type="$BUILD_TYPE" \
            --build-dir=build-ci \
            --tests --run-tests --no-examples \
            --test-exclude="$TEST_EXCLUDE" \
            --xvfb -j4 \
            --env=QT_QUICK_BACKEND=software

      - name: Build and test through HyRemote build system — Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          INTEGRATIONS: ${{ needs.classify.outputs.integrations }}
          BUILD_TYPE: ${{ needs.classify.outputs.build_type }}
          TEST_EXCLUDE: ${{ needs.classify.outputs.test_exclude }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call compile.cmd --integrations="%INTEGRATIONS%" --qt-prefix="%QT_PREFIX%" --build-type="%BUILD_TYPE%" --build-dir=build-ci --tests --run-tests --no-examples "--test-exclude=%TEST_EXCLUDE%" -j4

      - name: Test evidence summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG=build-ci/test.log
          {
            echo "## Test evidence — ${{ matrix.name }}"
            echo
            echo "- build type: ${{ needs.classify.outputs.build_type }}"
            echo "- clean Generic evidence requested: ${{ needs.classify.outputs.generic_evidence }}"
            echo
            if [[ ! -f "$LOG" ]]; then
              echo "No \`$LOG\` was produced, so the test phase never ran (build or configuration failure)."
              exit 0
            fi
            echo "### CTest summary"
            echo '```text'
            grep -E "[0-9]+% tests passed|Total Test time" "$LOG" || true
            echo '```'
            echo
            echo "### Failed tests"
            echo '```text'
            sed -n '/The following tests FAILED/,$p' "$LOG" || true
            echo '```'
            if [[ "${{ needs.classify.outputs.generic_evidence }}" == "true" ]]; then
              echo
              echo "### Required Generic evidence"
              echo '```text'
              grep -E "hyremote-generic-installed-consumers" "$LOG" || true
              echo '```'
              for f in build-ci/evidence/*/installed-generic-*/evidence.txt; do
                [[ -f "$f" ]] || continue
                echo '```text'
                echo "# $f"
                grep -E "^(CELL|CONSUMER|GENERIC_PAYLOAD|SOURCE_TREE_DEPENDENCY_COUNT|BUILD_TREE_DEPENDENCY_COUNT|RESULT)=" "$f" || true
                echo '```'
              done
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: failure() || needs.classify.outputs.generic_evidence == 'true' || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hyremote-test-log-${{ runner.os }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build-ci/test.log
            build-ci/evidence/*/summary.txt
            build-ci/evidence/*/*/evidence.txt
            build-ci/evidence/**/*.log

      - name: Save verified exact Qt SDK
        if: always() && steps.qt-cache.outputs.cache-hit != 'true' && env.QT_TREE_REBUILT == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: hyremote-qt-v4-${{ runner.os }}-6.8.3-${{ matrix.aqt_arch }}

      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"
          start="${CI_STARTED:-$now}"
          {
            echo "## CI timing"
            echo
            echo "- runner: ${{ matrix.name }}"
            echo "- integrations: ${{ needs.classify.outputs.integrations }}"
            echo "- build type: ${{ needs.classify.outputs.build_type }}"
            echo "- clean Generic evidence: ${{ needs.classify.outputs.generic_evidence }}"
            echo "- Qt cache hit: ${{ steps.qt-cache.outputs.cache-hit }}"
            echo "- Qt tree rebuilt: ${QT_TREE_REBUILT:-unknown}"
            echo "- build entry: compile.cmd + build.yml + command-line overrides"
            echo "- elapsed after environment start: $((now-start))s"
          } >> "$GITHUB_STEP_SUMMARY"

  no-product-change:
    name: No product CI needed
    needs: classify
    if: needs.classify.outputs.product != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "Documentation/governance-only change; Qt runner intentionally skipped."
