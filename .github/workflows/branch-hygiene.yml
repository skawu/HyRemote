name: Branch hygiene

# The steady-state remote branch set is main, develop and heads of open pull requests. GitHub's
# delete_branch_on_merge handles merged PRs; this scheduled/on-demand job also covers PRs closed
# without merging. It fails closed whenever repository facts are ambiguous.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Delete stale refs (false = dry run)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply documented branch deletion rule
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXECUTE: ${{ inputs.execute || 'false' }}
        run: |
          set -euo pipefail

          protected() {
            case "$1" in
              main|develop|HEAD) return 0 ;;
              release/*|backmerge/*|hotfix/*) return 0 ;;
            esac
            return 1
          }

          branches=$(gh api "repos/${REPO}/branches?per_page=100" --jq '.[].name')
          deleted=0
          kept=0

          for branch in $branches; do
            if protected "$branch"; then
              echo "keep   ${branch}  (long-lived or lifecycle ref)"
              kept=$((kept + 1))
              continue
            fi

            prs=$(gh api "repos/${REPO}/pulls?state=all&head=${REPO%%/*}:${branch}&per_page=100" \
                    --jq '[.[] | {number: .number, state: .state, merged: (.merged_at != null)}]')
            count=$(printf '%s' "$prs" | jq 'length')

            if [ "$count" -eq 0 ]; then
              echo "keep   ${branch}  (fail closed: no pull request to judge from)"
              kept=$((kept + 1))
              continue
            fi

            if printf '%s' "$prs" | jq -e 'any(.[]; .state == "open")' >/dev/null; then
              echo "keep   ${branch}  (head of an open pull request)"
              kept=$((kept + 1))
              continue
            fi

            if printf '%s' "$prs" | jq -e 'any(.[]; .state == "closed")' >/dev/null; then
              if [ "$EXECUTE" = "true" ]; then
                gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
                echo "delete ${branch}  (pull request merged or closed)"
              else
                echo "would  ${branch}  (pull request merged or closed; dry run)"
              fi
              deleted=$((deleted + 1))
              continue
            fi

            echo "keep   ${branch}  (fail closed: no closed pull-request state)"
            kept=$((kept + 1))
          done

          echo "---"
          echo "candidates=${deleted} kept=${kept} execute=${EXECUTE}"
