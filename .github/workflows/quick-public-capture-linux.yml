name: Qt Quick public capture and watermark Linux qualification

# Compile and execute the real Qt Quick CaptureSource on a second OS and
# scenegraph backend. Windows/D3D11 CTest cannot prove cross-platform
# queued-grab, lifetime and rendered-pixel semantics on its own.
on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/quick-public-capture-linux.yml
      - src/runtime/src/quick/**
      - src/runtime/src/detail/perf_probe.hpp
      - src/runtime/tests/test_cpu_probe_linux_clock.cpp
      - tools/perf/aggregate_cpu_probe.py
      - tools/perf/assess_quick_public_profile.py
      - src/runtime/src/detail/watermark_frame_decorator.cpp
      - src/runtime/tests/test_watermark_frame_decorator.cpp
      - src/runtime/tests/test_quick_capture.cpp
      - src/runtime/CMakeLists.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-quick-public-grab:
    name: Linux x86_64 / Qt 6.8.3 / Quick / CPU probe ${{ matrix.cpu_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cpu_probe: [OFF, ON]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache exact Linux Qt SDK
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.8.3-linux-gcc64-quick-public-v1

      - name: Install exact Qt 6.8.3 and Ninja
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check aqtinstall ninja
          if [ "${{ steps.qt-cache.outputs.cache-hit }}" != "true" ]; then
            python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          fi
          test -f "$RUNNER_TEMP/Qt/6.8.3/gcc_64/lib/libQt6Quick.so"

      - name: Install real Linux Qt QPA/Xvfb dependencies
        shell: bash
        run: bash .github/scripts/install-linux-qt-desktop-deps.sh qpa

      - name: Validate public Qt Quick capture and immutable-source watermark reuse
        shell: bash
        run: |
          set -euo pipefail
          sh ./build.cmd test \
            --mode=runtime \
            --qt-prefix="$RUNNER_TEMP/Qt/6.8.3/gcc_64" \
            --build-type=Release \
            --build-dir=build-quick-public-linux-${{ matrix.cpu_probe }} \
            --tests --run-tests --no-examples \
            --xvfb --clean -j4 \
            "--cmake=HYREMOTE_BUILD_QUICK_ADAPTER=ON" \
            "--cmake=HYREMOTE_ENABLE_CPU_PROBE=${{ matrix.cpu_probe }}" \
            "--cmake=HYREMOTE_EXPERIMENTAL_QUICK_ACTIVITY_WAKE=${{ matrix.cpu_probe }}" \
            "--test-filter=^hyremote-(quick-capture|watermark-frame-decorator|linux-cpu-probe)-test$" \
            "--env=QT_QUICK_BACKEND=software"

      - name: Verify public capture on a real OpenGL scenegraph (Mesa/Xvfb)
        shell: bash
        run: |
          set -euo pipefail
          test -x build-quick-public-linux-${{ matrix.cpu_probe }}/runtime/tests/hyremote-quick-capture-test
          xvfb-run -a -s "-screen 0 1920x1080x24" env \
            -u QT_QUICK_BACKEND \
            QT_QPA_PLATFORM=xcb \
            QSG_RHI_BACKEND=opengl \
            LIBGL_ALWAYS_SOFTWARE=1 \
            HYREMOTE_EXPECT_QUICK_OPENGL=1 \
            ./build-quick-public-linux-${{ matrix.cpu_probe }}/runtime/tests/hyremote-quick-capture-test

      - name: Qualify true 1080p PUBLIC capture CPU and A1 / page-change / A2 drift
        shell: bash
        run: |
          set -euo pipefail
          python tools/perf/assess_quick_public_profile.py --self-test
          bin="./build-quick-public-linux-${{ matrix.cpu_probe }}/runtime/tests/hyremote-quick-capture-test"
          test -x "$bin"
          stamp="$(git rev-parse HEAD)"
          profile_dir="$PWD/build-quick-public-linux-${{ matrix.cpu_probe }}"
          xvfb-run -a -s "-screen 0 1920x1080x24" env \
            QT_QPA_PLATFORM=xcb \
            QT_QUICK_BACKEND=software \
            HYREMOTE_QUICK_PUBLIC_PROFILE=1 \
            HYREMOTE_PUBLIC_PROFILE_EXPECT_BACKEND=software \
            HYREMOTE_EXPECT_PHYSICAL_1080P=1 \
            HYREMOTE_PUBLIC_PROFILE_PROBE_MODE="${{ matrix.cpu_probe }}" \
            HYREMOTE_QUICK_PUBLIC_PROFILE_FILE="$profile_dir/public-quick-software.json" \
            GITHUB_SHA="$stamp" \
            "$bin"
          python tools/perf/assess_quick_public_profile.py \
            --expected-backend software "$profile_dir/public-quick-software.json"
          xvfb-run -a -s "-screen 0 1920x1080x24" env \
            -u QT_QUICK_BACKEND \
            QT_QPA_PLATFORM=xcb \
            QSG_RHI_BACKEND=opengl \
            LIBGL_ALWAYS_SOFTWARE=1 \
            HYREMOTE_QUICK_PUBLIC_PROFILE=1 \
            HYREMOTE_PUBLIC_PROFILE_EXPECT_BACKEND=opengl \
            HYREMOTE_EXPECT_PHYSICAL_1080P=1 \
            HYREMOTE_PUBLIC_PROFILE_PROBE_MODE="${{ matrix.cpu_probe }}" \
            HYREMOTE_QUICK_PUBLIC_PROFILE_FILE="$profile_dir/public-quick-opengl.json" \
            GITHUB_SHA="$stamp" \
            "$bin"
          python tools/perf/assess_quick_public_profile.py \
            --expected-backend opengl "$profile_dir/public-quick-opengl.json"

      - name: Preserve synthetic, source-stamped public capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt683-public-grab-${{ matrix.cpu_probe }}
          path: |
            build-quick-public-linux-${{ matrix.cpu_probe }}/public-quick-software.json
            build-quick-public-linux-${{ matrix.cpu_probe }}/public-quick-opengl.json
          if-no-files-found: ignore
          retention-days: 14
