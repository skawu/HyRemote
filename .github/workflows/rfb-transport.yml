name: Bounded RFB transport

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/core/**'
      - 'src/remoteaccess/**'
      - '.github/workflows/rfb-transport.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-fit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / Qt 6.8.3 / maintained VNC client / shared RemoteAccess
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / Qt 6.8.3 / maintained VNC client / shared RemoteAccess
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt, Ninja and maintained VNC client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja 'vncdotool==1.3.0'
          aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"

      - name: Configure, build, unit test and product-fit — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S . -B build-rfb -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHYREMOTE_BUILD_CORE=ON \
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON \
            -DHYREMOTE_BUILD_WIDGETS_ADAPTER=OFF \
            -DHYREMOTE_BUILD_QUICK_ADAPTER=OFF \
            -DHYREMOTE_BUILD_TESTS=ON \
            -DHYREMOTE_BUILD_SPIKES=OFF \
            -DHYREMOTE_BUILD_EXAMPLES=OFF \
            -DHYREMOTE_WITH_VNC=ON
          cmake --build build-rfb --parallel
          test -f build-rfb/remoteaccess/libHyRemoteRemoteAccess.so
          ctest --test-dir build-rfb --output-on-failure
          LD_LIBRARY_PATH="$QT_PREFIX/lib:$PWD/build-rfb/remoteaccess:${LD_LIBRARY_PATH:-}" \
            python src/remoteaccess/tests/rfb_product_fit.py \
              build-rfb/remoteaccess/tests/hyremote-rfb-test-server

      - name: Configure, build, unit test and product-fit — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%QT_PREFIX%\bin;%CD%\build-rfb\remoteaccess;%PATH%"
          cmake -S . -B build-rfb -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DHYREMOTE_BUILD_CORE=ON ^
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON ^
            -DHYREMOTE_BUILD_WIDGETS_ADAPTER=OFF ^
            -DHYREMOTE_BUILD_QUICK_ADAPTER=OFF ^
            -DHYREMOTE_BUILD_TESTS=ON ^
            -DHYREMOTE_BUILD_SPIKES=OFF ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF ^
            -DHYREMOTE_WITH_VNC=ON
          cmake --build build-rfb --parallel
          if not exist "%CD%\build-rfb\remoteaccess\HyRemoteRemoteAccess.dll" exit /b 1
          ctest --test-dir build-rfb --output-on-failure
          python src\remoteaccess\tests\rfb_product_fit.py build-rfb\remoteaccess\tests\hyremote-rfb-test-server.exe
