name: RFB delivery profile

# #261: produce the W1-W4 profiling evidence without changing the ordinary
# product matrix. The jobs are manual (or run when this workflow file changes)
# and upload JSON instead of asserting an SLO.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rfb-profile.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Qt 6.8.3
        shell: bash
        run: |
          set -euo pipefail
          QT_ROOT="${RUNNER_TEMP//\\//}/Qt"
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 --outputdir "$QT_ROOT"
          echo "QT_PREFIX=$QT_ROOT/6.8.3/gcc_64" >> "$GITHUB_ENV"

      - name: Install Linux host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          bash .github/scripts/install-linux-qt-desktop-deps.sh public

      - name: Build the profiling test
        shell: bash
        run: |
          set -euo pipefail
          sh ./build.cmd build \
            --integrations=cpp \
            --qt-prefix="$QT_PREFIX" \
            --build-type=Release \
            --build-dir=build-profile \
            --tests --no-examples \
            -j4

      - name: Run W1-W4 profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-profile/profile
          HYREMOTE_RFB_PROFILE_FILE="$PWD/build-profile/profile/rfb-delivery-profile.json" \
            xvfb-run -a ./build-profile/runtime/tests/hyremote-rfb-wire-robustness-test

      - name: Upload profile JSON
        uses: actions/upload-artifact@v4
        with:
          name: rfb-delivery-profile-linux
          path: build-profile/profile/rfb-delivery-profile.json
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Qt 6.8.3
        shell: bash
        run: |
          set -euo pipefail
          QT_ROOT="${RUNNER_TEMP//\\//}/Qt"
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$QT_ROOT"
          echo "QT_PREFIX=$QT_ROOT/6.8.3/msvc2022_64" >> "$GITHUB_ENV"
          echo "$QT_ROOT/6.8.3/msvc2022_64/bin" >> "$GITHUB_PATH"

      - name: Build the profiling test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call build.cmd build --integrations=cpp --qt-prefix="%QT_PREFIX%" --build-type=Release --build-dir=build-profile --tests --no-examples -j4

      - name: Run W1-W4 profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-profile/profile | Out-Null
          $env:HYREMOTE_RFB_PROFILE_FILE = "$PWD/build-profile/profile/rfb-delivery-profile.json"
          $env:PATH = "$env:QT_PREFIX\bin;$PWD\build-profile\runtime;$env:PATH"
          & .\build-profile\runtime\tests\hyremote-rfb-wire-robustness-test.exe

      - name: Upload profile JSON
        uses: actions/upload-artifact@v4
        with:
          name: rfb-delivery-profile-windows
          path: build-profile/profile/rfb-delivery-profile.json
          if-no-files-found: error
          retention-days: 14
