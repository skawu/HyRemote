name: Git Flow policy

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainline-push-audit:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    steps:
      - name: Audit mainline push came through an accepted PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This is an after-the-fact audit only; it cannot undo a direct push and it
          # must never be described as branch protection when repository policy cannot enforce that before push.
          merged_prs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq ".[] | select(.merged_at != null and .base.ref == \"${BRANCH}\") | .number")"
          if [[ -z "${merged_prs}" ]]; then
            echo "mainline direct-push audit failed: ${GITHUB_SHA} has no merged PR into ${BRANCH}" >&2
            echo "This is governance evidence only; the workflow cannot roll back the push." >&2
            exit 1
          fi
          echo "mainline push audit passed for ${BRANCH}: merged PR(s) ${merged_prs//$'\n'/, }"

  pull-request-topology:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch topology
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "head=${HEAD_REF} base=${BASE_REF}"
          case "${HEAD_REF}" in
            feature/*)
              test "${BASE_REF}" = "develop" || { echo "feature/* PRs must target develop" >&2; exit 1; }
              ;;
            release/v*)
              test "${BASE_REF}" = "main" || { echo "release/v* PRs must target main" >&2; exit 1; }
              ;;
            backmerge/v*)
              test "${BASE_REF}" = "develop" || { echo "backmerge/v* PRs must target develop" >&2; exit 1; }
              ;;
            hotfix/*)
              case "${BASE_REF}" in main|develop) ;; *) echo "hotfix/* PRs may target only main or develop" >&2; exit 1;; esac
              ;;
            *)
              test "${BASE_REF}" = "develop" || { echo "only release/v* or hotfix/* may target main" >&2; exit 1; }
              ;;
          esac

      - name: Keep develop on the development version sentinel
        if: github.base_ref == 'develop'
        shell: python
        run: |
          import pathlib, re
          text = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"project\s*\(\s*HyRemote\s+VERSION\s+([0-9]+(?:\.[0-9]+){2,3})", text, re.S)
          if not match:
              raise SystemExit("root project(VERSION ...) is missing or malformed")
          version = match.group(1)
          if version != "0.0.0":
              raise SystemExit(f"PRs targeting develop must keep version sentinel 0.0.0; found {version}")
          print("develop version sentinel gate passed: 0.0.0")

      - name: Validate release candidate version before main merge
        if: startsWith(github.head_ref, 'release/v')
        shell: python
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          import os, pathlib, re
          head = os.environ["HEAD_REF"]
          if os.environ["BASE_REF"] != "main":
              raise SystemExit("release/v* candidates must target main")
          match = re.fullmatch(r"release/v([0-9]+(?:\.[0-9]+){3})", head)
          if not match:
              raise SystemExit("release branches must use release/vMajor.Minor.Feature.Maintenance")
          version = match.group(1)
          if version not in {"0.0.1.0", "0.0.2.0", "0.0.3.0", "1.0.0.0"}:
              raise SystemExit(f"release/{version} is not an authorized milestone")
          text = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")
          cmake = re.search(r"project\s*\(\s*HyRemote\s+VERSION\s+([0-9]+(?:\.[0-9]+){3})", text, re.S)
          if not cmake or cmake.group(1) != version:
              raise SystemExit(f"release branch version {version} must equal root CMake four-part version")
          print(f"release candidate version gate passed for v{version}")

      - name: Require accepted milestone authorities before release PR
        if: startsWith(github.head_ref, 'release/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#release/v}"
          case "${version}" in
            0.0.1.0) required_issues=(30) ;;
            0.0.2.0) required_issues=(30 31) ;;
            0.0.3.0) required_issues=(30 31 32) ;;
            1.0.0.0)
              authority_file=".github/release/v1-mandatory-issues.json"
              test -f "${authority_file}" || { echo "missing ${authority_file}" >&2; exit 1; }
              test "$(jq -r '.version' "${authority_file}")" = "${version}" || {
                echo "${authority_file} version does not match release/v${version}" >&2
                exit 1
              }
              mapfile -t required_issues < <(jq -r '.required_issue_numbers[]' "${authority_file}")
              test "${#required_issues[@]}" -gt 0 || { echo "V1 mandatory authority list is empty" >&2; exit 1; }
              ;;
            *) echo "no release-authority mapping for ${version}" >&2; exit 1 ;;
          esac

          for issue in "${required_issues[@]}"; do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq '[.state, (.state_reason // "")] | @tsv')"
            IFS=$'\t' read -r state reason <<< "${response}"
            if [[ "${state}" != "closed" || "${reason}" == "not_planned" ]]; then
              echo "release/v${version} is not authorized: issue #${issue} state=${state} reason=${reason:-none}" >&2
              exit 1
            fi
            echo "authority #${issue}: closed (${reason:-unspecified})"
          done
          echo "release authority gate passed for v${version}"

      - name: Validate milestone release-note state
        if: startsWith(github.head_ref, 'release/v')
        shell: python
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          import os, pathlib, re
          head = os.environ["HEAD_REF"]
          match = re.fullmatch(r"release/v([0-9]+(?:\.[0-9]+){3})", head)
          if not match:
              raise SystemExit(f"invalid release branch name: {head}")
          version = match.group(1)
          notes = pathlib.Path(f"docs/releases/v{version}.md")
          if not notes.is_file():
              raise SystemExit(f"release branch {head} requires {notes}")
          text = notes.read_text(encoding="utf-8")
          for required in (f"v{version}", f"release/v{version}", "## Security boundary"):
              if required not in text:
                  raise SystemExit(f"{notes} is missing required release fact/section: {required}")
          marker = "Status: **candidate / acceptance pending**"
          is_draft = os.environ.get("PR_DRAFT", "true").lower() == "true"
          if is_draft and marker not in text:
              raise SystemExit(f"Draft release PR {head} must keep the candidate marker")
          if not is_draft and marker in text:
              raise SystemExit(f"ready release PR {head} still says acceptance pending")
          print(f"release-note state gate passed for {head}")

      - name: Validate released-history backmerge
        if: startsWith(github.head_ref, 'backmerge/v')
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#backmerge/v}"
          case "${version}" in 0.0.1.0|0.0.2.0|0.0.3.0|1.0.0.0) ;; *) echo "unauthorized backmerge milestone ${version}" >&2; exit 1;; esac
          tag="v${version}"
          git fetch origin main "refs/tags/${tag}:refs/tags/${tag}" --force
          git fetch origin "${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" --force
          test "$(git cat-file -t "refs/tags/${tag}")" = "tag" || { echo "backmerge requires annotated ${tag}" >&2; exit 1; }
          tagged_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          git merge-base --is-ancestor "${tagged_commit}" origin/main || { echo "${tag} not in current main history" >&2; exit 1; }
          git merge-base --is-ancestor "${tagged_commit}" "origin/${HEAD_REF}" || { echo "${HEAD_REF} lacks ${tagged_commit}" >&2; exit 1; }
          echo "backmerge gate passed for ${tag}"

  release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate four-part authorized milestone tag
        shell: python
        run: |
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v([0-9]+(?:\.[0-9]+){3})", tag)
          if not match:
              raise SystemExit("HyRemote release tags must use vMajor.Minor.Feature.Maintenance")
          if match.group(1) not in {"0.0.1.0", "0.0.2.0", "0.0.3.0", "1.0.0.0"}:
              raise SystemExit(f"tag {tag} is not an authorized milestone")

      - name: Require annotated tag on exact main release head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" || {
            echo "release tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          }
          tagged_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          main_head="$(git rev-parse origin/main)"
          test "${tagged_commit}" = "${main_head}" || {
            echo "release tag ${GITHUB_REF_NAME} must point to exact current main HEAD" >&2
            exit 1
          }

      - name: Require CMake version to match tag
        shell: python
        run: |
          import os, pathlib, re
          text = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"project\s*\(\s*HyRemote\s+VERSION\s+([0-9]+(?:\.[0-9]+){3})", text, re.S)
          if not match:
              raise SystemExit("root project(VERSION ...) must contain a four-part release version")
          if match.group(1) != os.environ["GITHUB_REF_NAME"][1:]:
              raise SystemExit("release tag does not match root CMake project version")

      - name: Require finalized milestone release notes
        shell: python
        run: |
          import os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          notes = pathlib.Path(f"docs/releases/{tag}.md")
          if not notes.is_file():
              raise SystemExit(f"release tag {tag} requires {notes}")
          text = notes.read_text(encoding="utf-8")
          if "Status: **candidate / acceptance pending**" in text:
              raise SystemExit(f"tagged release {tag} still contains the candidate marker")
          for required in (tag, f"release/{tag}", "## Security boundary"):
              if required not in text:
                  raise SystemExit(f"{notes} is missing required release fact/section: {required}")
          print(f"final release-note gate passed for {tag}")

      - name: Audit release tag fact
        shell: bash
        run: |
          set -euo pipefail
          tagged_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          echo "Validated annotated release tag ${GITHUB_REF_NAME} at exact main head ${tagged_commit}."
          echo "This post-push audit does not replace the pre-merge release/v* gate."
