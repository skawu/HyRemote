name: Git Flow policy

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pull-request-topology:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate branch topology
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "head=${HEAD_REF} base=${BASE_REF}"

          case "${HEAD_REF}" in
            feature/*)
              test "${BASE_REF}" = "develop" || {
                echo "feature/* PRs must target develop" >&2
                exit 1
              }
              ;;
            release/v*)
              test "${BASE_REF}" = "main" || {
                echo "release/v* PRs must target main" >&2
                exit 1
              }
              ;;
            hotfix/*)
              case "${BASE_REF}" in
                main|develop) ;;
                *)
                  echo "hotfix/* PRs may target only main or develop" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              # Historical atomic/stacked branches are deliberately not force-renamed. They may
              # converge into develop, but no legacy/non-release branch may bypass the release gate.
              test "${BASE_REF}" = "develop" || {
                echo "only release/v* or hotfix/* may target main" >&2
                exit 1
              }
              ;;
          esac

  release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate four-part release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "HyRemote release tags must use vMajor.Minor.Feature.Maintenance" >&2
            exit 1
          fi

      - name: Require tag commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "release tag ${GITHUB_REF_NAME} must point to a commit reachable from main" >&2
            exit 1
          }

      - name: Require CMake version to match tag
        shell: python
        run: |
          import pathlib
          import re
          import os

          text = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"project\s*\(\s*HyRemote\s+VERSION\s+([0-9]+(?:\.[0-9]+){3})", text, re.S)
          if not match:
              raise SystemExit("root project(VERSION ...) must contain a four-part release version")

          cmake_version = match.group(1)
          tag_version = os.environ["GITHUB_REF_NAME"][1:]
          if cmake_version != tag_version:
              raise SystemExit(
                  f"tag {tag_version} does not match root CMake project version {cmake_version}"
              )

      - name: Reject pre-acceptance tag mutation convention
        shell: bash
        run: |
          set -euo pipefail
          echo "Validated immutable release tag candidate ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
          echo "Milestone acceptance/Release publication remains governed by docs/git-flow-release.md."
