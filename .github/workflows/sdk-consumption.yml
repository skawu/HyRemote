name: SDK consumption

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'remoteaccess/**'
      - 'tests/consumer-installed-sdk/**'
      - 'tests/consumer-source/**'
      - 'tests/public-api-contract/**'
      - '.github/workflows/sdk-consumption.yml'
  workflow_dispatch:

jobs:
  consume:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / fixed shared facade / installed + source
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / fixed shared facade / installed + source
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt and Ninja
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"

      - name: Build, install and consume — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          SDK_PREFIX="$RUNNER_TEMP/hyremote-sdk"

          cmake -S . -B build-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$SDK_PREFIX" \
            -DHYREMOTE_BUILD_CORE=ON \
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON \
            -DHYREMOTE_BUILD_TESTS=OFF \
            -DHYREMOTE_BUILD_SPIKES=OFF \
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build-sdk --parallel
          cmake --install build-sdk

          # Fixed V1 product shape: Core is static/internal; RemoteAccess is the one shared product library.
          test -f "$SDK_PREFIX/lib/libhyremote-core.a"
          test -f "$SDK_PREFIX/lib/libHyRemoteRemoteAccess.so"
          test ! -e "$SDK_PREFIX/lib/libhyremote-core.so"

          cmake -S tests/consumer-installed-sdk -B build-consumer-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$SDK_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deploy-installed"
          cmake --build build-consumer-installed --parallel
          cmake --install build-consumer-installed
          test -f deploy-installed/bin/hyremote-installed-consumer
          test -f deploy-installed/lib/libHyRemoteRemoteAccess.so
          env -u LD_LIBRARY_PATH deploy-installed/bin/hyremote-installed-consumer

          cmake -S tests/public-api-contract -B build-public-api-contract -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$SDK_PREFIX"
          cmake --build build-public-api-contract --parallel
          LD_LIBRARY_PATH="$SDK_PREFIX/lib:$QT_PREFIX/lib" \
            ./build-public-api-contract/hyremote-public-api-contract

          cmake -S tests/consumer-source -B build-consumer-source -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deploy-source" \
            -DHYREMOTE_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-consumer-source --parallel
          cmake --install build-consumer-source
          test -f deploy-source/bin/hyremote-source-consumer
          test -f deploy-source/lib/libHyRemoteRemoteAccess.so
          env -u LD_LIBRARY_PATH deploy-source/bin/hyremote-source-consumer

      - name: Build, install and consume — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "SDK_PREFIX=%RUNNER_TEMP%\hyremote-sdk"
          set "PATH=%QT_PREFIX%\bin;%PATH%"

          cmake -S . -B build-sdk -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%SDK_PREFIX%" ^
            -DHYREMOTE_BUILD_CORE=ON ^
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON ^
            -DHYREMOTE_BUILD_TESTS=OFF ^
            -DHYREMOTE_BUILD_SPIKES=OFF ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build-sdk --parallel
          cmake --install build-sdk
          if not exist "%SDK_PREFIX%\bin\HyRemoteRemoteAccess.dll" exit /b 1
          if exist "%SDK_PREFIX%\bin\hyremote-core.dll" exit /b 1

          cmake -S tests\consumer-installed-sdk -B build-consumer-installed -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%;%SDK_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\deploy-installed"
          cmake --build build-consumer-installed --parallel
          cmake --install build-consumer-installed
          if not exist "%CD%\deploy-installed\bin\hyremote-installed-consumer.exe" exit /b 1
          if not exist "%CD%\deploy-installed\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "PATH=%CD%\deploy-installed\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\deploy-installed\bin\hyremote-installed-consumer.exe"

          rem Restore build-time toolchain paths only for the API-contract build.
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%QT_PREFIX%\bin;%SDK_PREFIX%\bin;%PATH%"
          cmake -S tests\public-api-contract -B build-public-api-contract -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%;%SDK_PREFIX%"
          cmake --build build-public-api-contract --parallel
          build-public-api-contract\hyremote-public-api-contract.exe

          rem Source/vendored consumption must deploy with the exact same public helper contract.
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S tests\consumer-source -B build-consumer-source -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\deploy-source" ^
            -DHYREMOTE_SOURCE_DIR="%GITHUB_WORKSPACE%"
          cmake --build build-consumer-source --parallel
          cmake --install build-consumer-source
          if not exist "%CD%\deploy-source\bin\hyremote-source-consumer.exe" exit /b 1
          if not exist "%CD%\deploy-source\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "PATH=%CD%\deploy-source\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\deploy-source\bin\hyremote-source-consumer.exe"
