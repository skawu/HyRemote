name: SDK consumption

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'remoteaccess/**'
      - 'qml/**'
      - 'qpa/**'
      - 'examples/qpa-proxy-existing-app/**'
      - 'tests/consumer-installed-sdk/**'
      - 'tests/consumer-installed-qml/**'
      - 'tests/consumer-installed-qpa/**'
      - 'tests/consumer-source/**'
      - 'tests/public-api-contract/**'
      - 'tests/release-readiness/**'
      - '.github/workflows/sdk-consumption.yml'
  workflow_dispatch:

jobs:
  consume:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / fixed shared facade / installed + source
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / fixed shared facade / installed + source
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt and Ninja
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"

      - name: Install Linux native-window dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0

      - name: Build, install and consume — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          SDK_PREFIX="$RUNNER_TEMP/hyremote-sdk"

          cmake -S . -B build-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$SDK_PREFIX" \
            -DHYREMOTE_BUILD_CORE=ON \
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON \
            -DHYREMOTE_BUILD_TESTS=OFF \
            -DHYREMOTE_BUILD_SPIKES=OFF \
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build-sdk --parallel
          cmake --install build-sdk

          test -f "$SDK_PREFIX/lib/libHyRemoteRemoteAccess.so"
          test -z "$(find "$SDK_PREFIX/lib" -maxdepth 1 -type f -name 'libhyremote-core*' -print -quit)"

          cmake -S tests/consumer-installed-sdk -B build-consumer-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$SDK_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deploy-installed"
          cmake --build build-consumer-installed --parallel
          cmake --install build-consumer-installed
          test -f deploy-installed/bin/hyremote-installed-consumer
          test -f deploy-installed/lib/libHyRemoteRemoteAccess.so
          env -u LD_LIBRARY_PATH deploy-installed/bin/hyremote-installed-consumer

          cmake -S tests/public-api-contract -B build-public-api-contract -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$SDK_PREFIX"
          cmake --build build-public-api-contract --parallel
          LD_LIBRARY_PATH="$SDK_PREFIX/lib:$QT_PREFIX/lib" \
            ./build-public-api-contract/hyremote-public-api-contract

          # Source shape 1/4: Embedded C++.
          cmake -S tests/consumer-source -B build-consumer-source -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deploy-source" \
            -DHYREMOTE_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-consumer-source --parallel
          cmake --install build-consumer-source
          test -f deploy-source/bin/hyremote-source-consumer
          test -f deploy-source/lib/libHyRemoteRemoteAccess.so
          env -u LD_LIBRARY_PATH deploy-source/bin/hyremote-source-consumer

          # Source shape 2/4: Declarative QML only.
          cmake -S tests/consumer-installed-qml -B build-consumer-source-qml -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deploy-source-qml" \
            -DHYREMOTE_CONSUMER_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-consumer-source-qml --parallel
          cmake --install build-consumer-source-qml
          test -f deploy-source-qml/bin/hyremote-installed-qml-consumer
          test -f deploy-source-qml/qml/HyRemote/qmldir
          test -f deploy-source-qml/lib/libHyRemoteRemoteAccess.so
          env -u LD_LIBRARY_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
            QT_QPA_PLATFORM=offscreen \
            deploy-source-qml/bin/hyremote-installed-qml-consumer

          # Source shape 3/4: Transparent QPA using the exact E4 Qt-only source.
          cmake -S tests/consumer-installed-qpa -B build-consumer-source-qpa -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deploy-source-qpa" \
            -DHYREMOTE_CONSUMER_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-consumer-source-qpa --parallel
          cmake --install build-consumer-source-qpa
          test -f deploy-source-qpa/bin/hyremote-installed-qpa-consumer
          test -f deploy-source-qpa/plugins/platforms/libqhyremote.so
          test -f deploy-source-qpa/lib/libHyRemoteRemoteAccess.so
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QT_QPA_PLATFORM \
            xvfb-run -a python tests/consumer-installed-qpa/product_fit.py \
              --app "$PWD/deploy-source-qpa/bin/hyremote-installed-qpa-consumer" \
              --port 5994

          # Source shape 4/4: QML + QPA using the same clean declarative application fixture.
          cmake -S tests/consumer-installed-qml -B build-consumer-source-qml-qpa -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deploy-source-qml-qpa" \
            -DHYREMOTE_CONSUMER_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DHYREMOTE_CONSUMER_WITH_QPA=ON
          cmake --build build-consumer-source-qml-qpa --parallel
          cmake --install build-consumer-source-qml-qpa
          test -f deploy-source-qml-qpa/bin/hyremote-installed-qml-consumer
          test -f deploy-source-qml-qpa/qml/HyRemote/qmldir
          test -f deploy-source-qml-qpa/plugins/platforms/libqhyremote.so
          test -f deploy-source-qml-qpa/lib/libHyRemoteRemoteAccess.so
          env -u LD_LIBRARY_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
              -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QT_QPA_PLATFORM \
            xvfb-run -a python tests/consumer-installed-qpa/product_fit.py \
              --app "$PWD/deploy-source-qml-qpa/bin/hyremote-installed-qml-consumer" \
              --port 5995

      - name: Build, install and consume — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "SDK_PREFIX=%RUNNER_TEMP%\hyremote-sdk"
          rem Preserve the runner + MSVC build tool PATH before any clean-deployment run narrows it.
          set "BUILD_PATH=%PATH%"
          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"

          cmake -S . -B build-sdk -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%SDK_PREFIX%" ^
            -DHYREMOTE_BUILD_CORE=ON ^
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON ^
            -DHYREMOTE_BUILD_TESTS=OFF ^
            -DHYREMOTE_BUILD_SPIKES=OFF ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build-sdk --parallel
          cmake --install build-sdk
          if not exist "%SDK_PREFIX%\bin\HyRemoteRemoteAccess.dll" exit /b 1
          if exist "%SDK_PREFIX%\lib\hyremote-core.lib" exit /b 1
          if exist "%SDK_PREFIX%\bin\hyremote-core.dll" exit /b 1

          cmake -S tests\consumer-installed-sdk -B build-consumer-installed -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%;%SDK_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\deploy-installed"
          cmake --build build-consumer-installed --parallel
          cmake --install build-consumer-installed
          if not exist "%CD%\deploy-installed\bin\hyremote-installed-consumer.exe" exit /b 1
          if not exist "%CD%\deploy-installed\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "PATH=%CD%\deploy-installed\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\deploy-installed\bin\hyremote-installed-consumer.exe"

          rem Restore all runner/MSVC build tools, not just Visual Studio variables, after clean PATH.
          set "PATH=%QT_PREFIX%\bin;%SDK_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\public-api-contract -B build-public-api-contract -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%;%SDK_PREFIX%"
          cmake --build build-public-api-contract --parallel
          build-public-api-contract\hyremote-public-api-contract.exe

          rem Source shape 1/4: Embedded C++.
          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\consumer-source -B build-consumer-source -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\deploy-source" ^
            -DHYREMOTE_SOURCE_DIR="%GITHUB_WORKSPACE%"
          cmake --build build-consumer-source --parallel
          cmake --install build-consumer-source
          if not exist "%CD%\deploy-source\bin\hyremote-source-consumer.exe" exit /b 1
          if not exist "%CD%\deploy-source\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "PATH=%CD%\deploy-source\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\deploy-source\bin\hyremote-source-consumer.exe"

          rem Source shape 2/4: Declarative QML only.
          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\consumer-installed-qml -B build-consumer-source-qml -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\deploy-source-qml" ^
            -DHYREMOTE_CONSUMER_SOURCE_DIR="%GITHUB_WORKSPACE%"
          cmake --build build-consumer-source-qml --parallel
          cmake --install build-consumer-source-qml
          if not exist "%CD%\deploy-source-qml\bin\hyremote-installed-qml-consumer.exe" exit /b 1
          if not exist "%CD%\deploy-source-qml\qml\HyRemote\qmldir" exit /b 1
          if not exist "%CD%\deploy-source-qml\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "QML2_IMPORT_PATH="
          set "QML_IMPORT_PATH="
          set "QT_QPA_PLATFORM=offscreen"
          set "PATH=%CD%\deploy-source-qml\bin;%SystemRoot%\System32;%SystemRoot%"
          "%CD%\deploy-source-qml\bin\hyremote-installed-qml-consumer.exe"

          rem Source shape 3/4: Transparent QPA using the exact E4 Qt-only application source.
          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\consumer-installed-qpa -B build-consumer-source-qpa -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\deploy-source-qpa" ^
            -DHYREMOTE_CONSUMER_SOURCE_DIR="%GITHUB_WORKSPACE%"
          cmake --build build-consumer-source-qpa --parallel
          cmake --install build-consumer-source-qpa
          if not exist "%CD%\deploy-source-qpa\bin\hyremote-installed-qpa-consumer.exe" exit /b 1
          if not exist "%CD%\deploy-source-qpa\plugins\platforms\qhyremote.dll" exit /b 1
          if not exist "%CD%\deploy-source-qpa\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "QT_PLUGIN_PATH="
          set "QT_QPA_PLATFORM_PLUGIN_PATH="
          set "QT_QPA_PLATFORM="
          python tests\consumer-installed-qpa\product_fit.py ^
            --app "%CD%\deploy-source-qpa\bin\hyremote-installed-qpa-consumer.exe" ^
            --port 5994

          rem Source shape 4/4: QML + QPA using the same clean declarative application fixture.
          set "PATH=%QT_PREFIX%\bin;%BUILD_PATH%"
          cmake -S tests\consumer-installed-qml -B build-consumer-source-qml-qpa -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%CD%\deploy-source-qml-qpa" ^
            -DHYREMOTE_CONSUMER_SOURCE_DIR="%GITHUB_WORKSPACE%" ^
            -DHYREMOTE_CONSUMER_WITH_QPA=ON
          cmake --build build-consumer-source-qml-qpa --parallel
          cmake --install build-consumer-source-qml-qpa
          if not exist "%CD%\deploy-source-qml-qpa\bin\hyremote-installed-qml-consumer.exe" exit /b 1
          if not exist "%CD%\deploy-source-qml-qpa\qml\HyRemote\qmldir" exit /b 1
          if not exist "%CD%\deploy-source-qml-qpa\plugins\platforms\qhyremote.dll" exit /b 1
          if not exist "%CD%\deploy-source-qml-qpa\bin\HyRemoteRemoteAccess.dll" exit /b 1
          set "QML2_IMPORT_PATH="
          set "QML_IMPORT_PATH="
          set "QT_PLUGIN_PATH="
          set "QT_QPA_PLATFORM_PLUGIN_PATH="
          set "QT_QPA_PLATFORM="
          python tests\consumer-installed-qpa\product_fit.py ^
            --app "%CD%\deploy-source-qml-qpa\bin\hyremote-installed-qml-consumer.exe" ^
            --port 5995
