name: Third-party core applications

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/104-v1-ga-acceptance-matrix
      - develop
    paths:
      - '.gitmodules'
      - 'cmake/**'
      - 'src/**'
      - 'integrations/qpa/**'
      - 'tests/third_party/**'
      - 'tools/third_party/**'
      - '.github/scripts/install-linux-qt-desktop-deps.sh'
      - '.github/workflows/third-party-core-apps.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlitebrowser-qpa:
    name: SQLiteBrowser pristine QPA / ${{ matrix.os }} / Qt 6.8.3
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
            qt_dir: gcc_64
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            qt_dir: msvc2022_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize pristine SQLiteBrowser upstream
        shell: bash
        run: |
          git submodule sync -- tests/third_party/apps/sqlitebrowser
          git submodule update --init --depth 1 -- tests/third_party/apps/sqlitebrowser
          python tools/third_party/verify_clean.py --apps sqlitebrowser
          python tools/third_party/materialize.py --app sqlitebrowser --lane qt68-ref --dest "$RUNNER_TEMP/sqlitebrowser-src"

      - name: Install exact Qt 6.8.3 product/app dependency closure
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt "${{ matrix.host }}" desktop 6.8.3 "${{ matrix.arch }}" \
            --archives qtbase qtdeclarative qttools --modules qt5compat --outputdir "$RUNNER_TEMP/Qt"

      - name: Prepare SQLiteBrowser generated translations in disposable source
        shell: bash
        run: |
          python tools/third_party/prepare_sqlitebrowser.py \
            --source "$RUNNER_TEMP/sqlitebrowser-src" \
            --qt-prefix "$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash .github/scripts/install-linux-qt-desktop-deps.sh
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev xvfb

      - name: Install Windows SQLite/OpenSSL build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install sqlite3:x64-windows openssl:x64-windows

      - name: Build and install exact HyRemote SDK — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S . -B "$RUNNER_TEMP/hyremote-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/hyremote-sdk" \
            -DHYREMOTE_BUILD_QML_API=OFF \
            -DHYREMOTE_BUILD_TESTS=OFF \
            -DHYREMOTE_BUILD_EXAMPLES=OFF \
            -DHYREMOTE_WITH_QPA_PROXY=ON
          cmake --build "$RUNNER_TEMP/hyremote-build" --parallel
          cmake --install "$RUNNER_TEMP/hyremote-build"

      - name: Build and install exact HyRemote SDK — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S . -B "%RUNNER_TEMP%\hyremote-build" -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\hyremote-sdk" ^
            -DHYREMOTE_BUILD_QML_API=OFF ^
            -DHYREMOTE_BUILD_TESTS=OFF ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF ^
            -DHYREMOTE_WITH_QPA_PROXY=ON
          cmake --build "%RUNNER_TEMP%\hyremote-build" --parallel
          cmake --install "%RUNNER_TEMP%\hyremote-build"

      - name: Configure/build/install pristine SQLiteBrowser QPA — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S tests/third_party/harness/sqlitebrowser-qpa -B "$RUNNER_TEMP/sqlitebrowser-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$RUNNER_TEMP/hyremote-sdk" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sqlitebrowser-install" \
            -DHYREMOTE_THIRD_PARTY_SOURCE="$RUNNER_TEMP/sqlitebrowser-src"
          cmake --build "$RUNNER_TEMP/sqlitebrowser-build" --parallel
          cmake --install "$RUNNER_TEMP/sqlitebrowser-build"
          test -x "$RUNNER_TEMP/sqlitebrowser-install/bin/sqlitebrowser"
          test -n "$(find "$RUNNER_TEMP/sqlitebrowser-install" -type f -name 'libqhyremote.so' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/sqlitebrowser-install" -type f -name 'libqxcb.so' -print -quit)"

      - name: Configure/build/install pristine SQLiteBrowser QPA — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "VCPKG_PREFIX=C:\vcpkg\installed\x64-windows"
          set "PATH=%QT_PREFIX%\bin;%VCPKG_PREFIX%\bin;%PATH%"
          cmake -S tests\third_party\harness\sqlitebrowser-qpa -B "%RUNNER_TEMP%\sqlitebrowser-build" -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%;%RUNNER_TEMP%\hyremote-sdk;%VCPKG_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\sqlitebrowser-install" ^
            -DHYREMOTE_THIRD_PARTY_SOURCE="%RUNNER_TEMP%\sqlitebrowser-src"
          cmake --build "%RUNNER_TEMP%\sqlitebrowser-build" --parallel
          cmake --install "%RUNNER_TEMP%\sqlitebrowser-build"
          if not exist "%RUNNER_TEMP%\sqlitebrowser-install\DB Browser for SQLite.exe" exit /b 1

      - name: Real RFB framebuffer/reconnect probe — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH \
            xvfb-run -a python tests/third_party/scenarios/qpa_framebuffer_probe.py \
              --app "$RUNNER_TEMP/sqlitebrowser-install/bin/sqlitebrowser" \
              --prefix "$RUNNER_TEMP/sqlitebrowser-install" --port 5994

      - name: Real RFB framebuffer/reconnect probe — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests/third_party/scenarios/qpa_framebuffer_probe.py `
            --app "$env:RUNNER_TEMP\sqlitebrowser-install\DB Browser for SQLite.exe" `
            --prefix "$env:RUNNER_TEMP\sqlitebrowser-install" --port 5994

      - name: Final pristine-upstream assertion
        if: always()
        run: python tools/third_party/verify_clean.py --apps sqlitebrowser
