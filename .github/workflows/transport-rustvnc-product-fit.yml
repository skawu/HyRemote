name: transport-rustvnc-product-fit

on:
  pull_request:
    paths:
      - "spikes/vnc-transport-rust-ffi/**"
      - ".github/workflows/transport-rustvnc-product-fit.yml"
      - ".github/workflows/transport-rustvnc-ffi-spike.yml"
  workflow_dispatch:

jobs:
  product-fit:
    name: product-fit-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maintained RFB client
        run: python -m pip install --disable-pip-version-check "vncdotool==1.3.0"

      - name: Install Rust 1.90.0
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Select Rust 1.90.0
        run: rustup override set 1.90.0

      - name: Build explicit-bind C ABI candidate
        run: cargo build --manifest-path spikes/vnc-transport-rust-ffi/shim/Cargo.toml --release

      - name: Run Linux standard-client product-fit probe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python spikes/vnc-transport-rust-ffi/product_fit.py \
            spikes/vnc-transport-rust-ffi/shim/target/release/libhyremote_vnc_rust_ffi_probe.so

      - name: Run Windows standard-client product-fit probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python spikes/vnc-transport-rust-ffi/product_fit.py `
            spikes/vnc-transport-rust-ffi/shim/target/release/hyremote_vnc_rust_ffi_probe.dll
