name: Third-party L2 real builds

on:
  workflow_dispatch:
  pull_request:
    branches:
      - test/134-realworld-qt-matrix
    paths:
      - '.gitmodules'
      - 'tests/third_party/**'
      - 'tools/third_party/**'
      - '.github/workflows/third-party-l2-real-builds.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shotcut-upstream-build:
    name: Shotcut pristine upstream build / Debian unstable
    runs-on: ubuntu-24.04
    container: debian:unstable
    timeout-minutes: 60
    steps:
      - name: Install upstream build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git ninja-build pkg-config python3 \
            libfftw3-dev libmlt-dev libmlt++-dev libx11-dev \
            qt6-base-dev qt6-base-private-dev qt6-charts-dev qt6-declarative-dev \
            qt6-l10n-tools qt6-tools-dev qt6-multimedia-dev qt6-websockets-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize pristine Shotcut tracking ref
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- tests/third_party/apps/shotcut
          git submodule update --init --depth 1 -- tests/third_party/apps/shotcut
          python3 tools/third_party/verify_clean.py --apps shotcut
          python3 tools/third_party/materialize.py --app shotcut --lane qt611 --dest "$RUNNER_TEMP/shotcut-src"
          qtpaths6 --qt-version || true
          cmake --version

      - name: Configure and build pristine Shotcut
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/shotcut-src" -B "$RUNNER_TEMP/shotcut-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLANG_FORMAT=OFF \
            -DBUILD_DOCS=OFF \
            -DSHOTCUT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/shotcut-build" --parallel

      - name: Final Shotcut cleanliness assertion
        if: always()
        shell: bash
        run: python3 tools/third_party/verify_clean.py --apps shotcut

  musescore-qt610-build:
    name: MuseScore pristine upstream / Qt 6.10.3 / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize and recursively materialize pristine MuseScore
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- tests/third_party/apps/musescore
          git submodule update --init --depth 1 -- tests/third_party/apps/musescore
          python tools/third_party/verify_clean.py --apps musescore
          python tools/third_party/materialize.py --app musescore --lane qt610 --dest "$RUNNER_TEMP/musescore-src"

      - name: Install Qt 6.10.3 using MuseScore module family
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
          cache: true

      - name: Prepare MuseScore official Linux CI environment
        shell: bash
        working-directory: ${{ runner.temp }}/musescore-src
        run: |
          set -euo pipefail
          bash ./buildscripts/ci/tools/make_build_mode_env.sh -e pull_request -m devel
          bash ./buildscripts/ci/tools/make_build_number.sh 0
          bash ./buildscripts/ci/linux/setup.sh --arch x86_64 --build-pipewire

      - name: Build pristine MuseScore through upstream CI entry point
        shell: bash
        working-directory: ${{ runner.temp }}/musescore-src
        run: |
          set -euo pipefail
          bash ./buildscripts/ci/linux/build.sh \
            -n 0 \
            --build_mode devel \
            --arch x86_64 \
            --build-pipewire \
            --dockwidgets_v2 ON

      - name: Final MuseScore cleanliness assertion
        if: always()
        shell: bash
        run: python tools/third_party/verify_clean.py --apps musescore
