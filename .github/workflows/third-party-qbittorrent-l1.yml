name: Third-party qBittorrent L1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - test/134-realworld-qt-matrix
    paths:
      - '.gitmodules'
      - 'cmake/**'
      - 'src/**'
      - 'integrations/qpa/**'
      - 'tests/third_party/**'
      - 'tools/third_party/**'
      - '.github/scripts/install-linux-qt-desktop-deps.sh'
      - '.github/workflows/third-party-qbittorrent-l1.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qbittorrent-qpa:
    name: qBittorrent pristine QPA / ${{ matrix.os }} / Qt 6.8.3
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
            qt_dir: gcc_64
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            qt_dir: msvc2022_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize pristine qBittorrent upstream
        shell: bash
        run: |
          git submodule sync -- tests/third_party/apps/qbittorrent
          git submodule update --init --depth 1 -- tests/third_party/apps/qbittorrent
          python tools/third_party/verify_clean.py --apps qbittorrent
          python tools/third_party/materialize.py --app qbittorrent --lane qt68-ref --dest "$RUNNER_TEMP/qbittorrent-src"

      - name: Install exact Qt 6.8.3 + qBittorrent Qt payload
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt "${{ matrix.host }}" desktop 6.8.3 "${{ matrix.arch }}" \
            --archives icu qtbase qtdeclarative qtsvg qttools \
            --modules qtimageformats --outputdir "$RUNNER_TEMP/Qt"

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash .github/scripts/install-linux-qt-desktop-deps.sh
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-dev libssl-dev zlib1g-dev xvfb

      - name: Build libtorrent 2.0.14 — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch v2.0.14 --depth 1 --recurse-submodules \
            https://github.com/arvidn/libtorrent.git "$RUNNER_TEMP/libtorrent"
          cmake -S "$RUNNER_TEMP/libtorrent" -B "$RUNNER_TEMP/libtorrent-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libtorrent-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -Ddeprecated-functions=OFF
          cmake --build "$RUNNER_TEMP/libtorrent-build" --parallel
          cmake --install "$RUNNER_TEMP/libtorrent-build"

      - name: Prepare qBittorrent Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = 'x64-windows-static-md-release'
          $overlay = 'C:\vcpkg\triplets_overlay'
          New-Item -Force -ItemType Directory -Path $overlay | Out-Null
          $tripletFile = Join-Path $overlay "$triplet.cmake"
          @(
            'set(VCPKG_TARGET_ARCHITECTURE x64)',
            'set(VCPKG_LIBRARY_LINKAGE static)',
            'set(VCPKG_CRT_LINKAGE dynamic)',
            'set(VCPKG_BUILD_TYPE release)'
          ) | Set-Content $tripletFile
          C:\vcpkg\vcpkg.exe install `
            --clean-after-build `
            --overlay-triplets=$overlay `
            "boost-build:$triplet" "openssl:$triplet" "zlib:$triplet"

          $boostVersion = '1.91.0'
          $boostArchive = "$env:RUNNER_TEMP\boost.tar.gz"
          curl.exe -L -o $boostArchive "https://archives.boost.io/release/$boostVersion/source/boost_1_91_0.tar.gz"
          tar.exe -xf $boostArchive -C $env:RUNNER_TEMP
          Rename-Item "$env:RUNNER_TEMP\boost_1_91_0" "$env:RUNNER_TEMP\boost"
          Push-Location "$env:RUNNER_TEMP\boost"
          C:\vcpkg\installed\$triplet\tools\boost-build\b2.exe stage toolset=msvc --stagedir=. --with-headers
          Pop-Location

      - name: Build libtorrent 2.0.14 — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "TRIPLET=x64-windows-static-md-release"
          set "OVERLAY=C:\vcpkg\triplets_overlay"
          git clone --branch v2.0.14 --depth 1 --recurse-submodules https://github.com/arvidn/libtorrent.git "%RUNNER_TEMP%\libtorrent"
          cmake -S "%RUNNER_TEMP%\libtorrent" -B "%RUNNER_TEMP%\libtorrent-build" -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CXX_STANDARD=20 ^
            -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\libtorrent-install" ^
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=%TRIPLET% ^
            -DVCPKG_OVERLAY_TRIPLETS="%OVERLAY%" ^
            -DBOOST_ROOT="%RUNNER_TEMP%\boost\lib\cmake" ^
            -DBUILD_SHARED_LIBS=OFF ^
            -Ddeprecated-functions=OFF ^
            -Dstatic_runtime=OFF
          cmake --build "%RUNNER_TEMP%\libtorrent-build" --parallel
          cmake --install "%RUNNER_TEMP%\libtorrent-build"

      - name: Build and install exact HyRemote SDK — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S . -B "$RUNNER_TEMP/hyremote-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/hyremote-sdk" \
            -DHYREMOTE_BUILD_QML_API=OFF \
            -DHYREMOTE_BUILD_TESTS=OFF \
            -DHYREMOTE_BUILD_EXAMPLES=OFF \
            -DHYREMOTE_WITH_QPA_PROXY=ON
          cmake --build "$RUNNER_TEMP/hyremote-build" --parallel
          cmake --install "$RUNNER_TEMP/hyremote-build"

      - name: Build and install exact HyRemote SDK — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S . -B "%RUNNER_TEMP%\hyremote-build" -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\hyremote-sdk" ^
            -DHYREMOTE_BUILD_QML_API=OFF ^
            -DHYREMOTE_BUILD_TESTS=OFF ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF ^
            -DHYREMOTE_WITH_QPA_PROXY=ON
          cmake --build "%RUNNER_TEMP%\hyremote-build" --parallel
          cmake --install "%RUNNER_TEMP%\hyremote-build"

      - name: Configure/build/install pristine qBittorrent QPA — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S tests/third_party/harness/qbittorrent-qpa -B "$RUNNER_TEMP/qbittorrent-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$RUNNER_TEMP/hyremote-sdk;$RUNNER_TEMP/libtorrent-install" \
            -DLibtorrentRasterbar_DIR="$RUNNER_TEMP/libtorrent-install/lib/cmake/LibtorrentRasterbar" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qbittorrent-install" \
            -DHYREMOTE_THIRD_PARTY_SOURCE="$RUNNER_TEMP/qbittorrent-src"
          cmake --build "$RUNNER_TEMP/qbittorrent-build" --parallel
          cmake --install "$RUNNER_TEMP/qbittorrent-build"
          test -x "$RUNNER_TEMP/qbittorrent-install/bin/qbittorrent"
          test -n "$(find "$RUNNER_TEMP/qbittorrent-install" -type f -name 'libqhyremote.so' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/qbittorrent-install" -type f -name 'libqxcb.so' -print -quit)"

      - name: Configure/build/install pristine qBittorrent QPA — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "TRIPLET=x64-windows-static-md-release"
          set "VCPKG_PREFIX=C:\vcpkg\installed\%TRIPLET%"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S tests\third_party\harness\qbittorrent-qpa -B "%RUNNER_TEMP%\qbittorrent-build" -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=%TRIPLET% ^
            -DVCPKG_OVERLAY_TRIPLETS="C:\vcpkg\triplets_overlay" ^
            -DBOOST_ROOT="%RUNNER_TEMP%\boost\lib\cmake" ^
            -DLibtorrentRasterbar_DIR="%RUNNER_TEMP%\libtorrent-install\lib\cmake\LibtorrentRasterbar" ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%;%RUNNER_TEMP%\hyremote-sdk;%RUNNER_TEMP%\libtorrent-install;%VCPKG_PREFIX%" ^
            -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\qbittorrent-install" ^
            -DHYREMOTE_THIRD_PARTY_SOURCE="%RUNNER_TEMP%\qbittorrent-src"
          cmake --build "%RUNNER_TEMP%\qbittorrent-build" --parallel
          cmake --install "%RUNNER_TEMP%\qbittorrent-build"
          if not exist "%RUNNER_TEMP%\qbittorrent-install\bin\qbittorrent.exe" exit /b 1

      - name: Real RFB framebuffer/reconnect probe — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qbittorrent-profile"
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH \
            xvfb-run -a python tests/third_party/scenarios/qpa_framebuffer_probe.py \
              --app "$RUNNER_TEMP/qbittorrent-install/bin/qbittorrent" \
              --prefix "$RUNNER_TEMP/qbittorrent-install" --port 5995 \
              --app-arg="--profile=$RUNNER_TEMP/qbittorrent-profile"

      - name: Real RFB framebuffer/reconnect probe — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\qbittorrent-profile" | Out-Null
          python tests/third_party/scenarios/qpa_framebuffer_probe.py `
            --app "$env:RUNNER_TEMP\qbittorrent-install\bin\qbittorrent.exe" `
            --prefix "$env:RUNNER_TEMP\qbittorrent-install" --port 5995 `
            --app-arg="--profile=$env:RUNNER_TEMP\qbittorrent-profile"

      - name: Final pristine-upstream assertion
        if: always()
        run: python tools/third_party/verify_clean.py --apps qbittorrent
