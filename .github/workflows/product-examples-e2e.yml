name: Embedded C++ product examples E2E

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'remoteaccess/**'
      - 'examples/**'
      - 'tests/product-e2e/**'
      - '.github/workflows/product-examples-e2e.yml'
  workflow_dispatch:

jobs:
  product-fit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / Qt 6.8.3 / public examples / vncdotool
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / Qt 6.8.3 / public examples / vncdotool
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt, Ninja and maintained VNC client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja 'vncdotool==1.3.0'
          aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"

      - name: Configure, build, regress and product-fit — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"
          cmake -S . -B build-e2e -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHYREMOTE_BUILD_CORE=ON \
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON \
            -DHYREMOTE_BUILD_WIDGETS_ADAPTER=ON \
            -DHYREMOTE_BUILD_QUICK_ADAPTER=ON \
            -DHYREMOTE_BUILD_TESTS=ON \
            -DHYREMOTE_BUILD_EXAMPLES=ON \
            -DHYREMOTE_BUILD_SPIKES=OFF \
            -DHYREMOTE_WITH_VNC=ON
          cmake --build build-e2e --parallel
          ctest --test-dir build-e2e --output-on-failure
          LD_LIBRARY_PATH="$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
            python tests/product-e2e/example_product_fit.py \
              --widgets build-e2e/examples/widgets-basic/hyremote-widgets-basic \
              --quick build-e2e/examples/quick-basic/hyremote-quick-basic
          LD_LIBRARY_PATH="$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
            python tests/product-e2e/showcase_product_fit.py \
              --showcase build-e2e/examples/remote-support-showcase/hyremote-remote-support-showcase

      - name: Configure, build, regress and product-fit — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S . -B build-e2e -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DHYREMOTE_BUILD_CORE=ON ^
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON ^
            -DHYREMOTE_BUILD_WIDGETS_ADAPTER=ON ^
            -DHYREMOTE_BUILD_QUICK_ADAPTER=ON ^
            -DHYREMOTE_BUILD_TESTS=ON ^
            -DHYREMOTE_BUILD_EXAMPLES=ON ^
            -DHYREMOTE_BUILD_SPIKES=OFF ^
            -DHYREMOTE_WITH_VNC=ON
          cmake --build build-e2e --parallel
          ctest --test-dir build-e2e --output-on-failure
          python tests\product-e2e\example_product_fit.py ^
            --widgets build-e2e\examples\widgets-basic\hyremote-widgets-basic.exe ^
            --quick build-e2e\examples\quick-basic\hyremote-quick-basic.exe
          python tests\product-e2e\showcase_product_fit.py ^
            --showcase build-e2e\examples\remote-support-showcase\hyremote-remote-support-showcase.exe
