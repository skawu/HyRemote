name: R4 Qt6.8.3 OpenGL PBO CaptureSource native compile gates (TEST ONLY)
on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/qt68-gl-pbo-source-r4.yml
      - src/runtime/CMakeLists.txt
      - src/runtime/src/quick/quick_target.cpp
      - src/runtime/src/quick/quick_gl_pbo_capture_source.*
      - tools/perf/tests/qt68_gl_pbo_source_r4/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-runtime:
    name: Windows MSVC Qt6.8.3 Runtime+Generic flag=${{ matrix.arm }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arm: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.8.3-windows-msvc2022_64-quick-overlap-v1
      - name: Prepare exact Qt6.8.3 MSVC Quick kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check aqtinstall ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = Join-Path $env:${{ runner.temp }} 'Qt/6.8.3/msvc2022_64'
          if (!(Test-Path (Join-Path $prefix 'bin/Qt6Quick.dll'))) {
            python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir (Join-Path $env:${{ runner.temp }} 'Qt')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path (Join-Path $prefix 'bin/Qt6Quick.dll'))) { throw 'Qt Kit missing' }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $prefix 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile actual Qt Quick Runtime and Generic integration (no packages)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arm = '${{ matrix.arm }}'
          $build = 'build-r4-' + $arm.ToLowerInvariant()
          if ((git rev-parse HEAD).Trim() -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Checkout SHA mismatch' }
          & .\build.cmd build --integrations=cpp,generic --examples "--qt-prefix=$env:QT_PREFIX" --build-type=Release "--build-dir=$build" --no-tests --clean -j4 "--cmake=HYREMOTE_EXPERIMENTAL_QUICK_GL_PBO=$arm"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setting = @(Get-Content "$build/CMakeCache.txt" | Where-Object {
            $_ -match '^HYREMOTE_EXPERIMENTAL_QUICK_GL_PBO:BOOL='
          })
          if ($setting.Count -ne 1 -or $setting[0] -ne "HYREMOTE_EXPERIMENTAL_QUICK_GL_PBO:BOOL=$arm") {
            throw "Incorrect actual CMake option: $($setting -join ',')"
          }
          $runtime = Get-ChildItem -Path $build -Filter 'HyRemoteRemoteAccess.dll' -File -Recurse | Select-Object -First 1
          if (!$runtime) { throw 'Native Runtime DLL absent' }
          Write-Host "R4_RUNTIME_COMPILE=PASS ${{ matrix.arm }}=$arm SHA=${{ github.event.pull_request.head.sha || github.sha }}"

  linux-qt68-real-capture-source:
    name: Qt6.8.3 GL-RHI real CaptureSource pixels/lifetime / ${{ matrix.loop }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        loop: [basic, threaded]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt6-6.8.3-linux-gcc64-openGL-rhi-eligibility-v1
      - name: Restore exact Qt6.8.3 Linux OpenGL Quick Kit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ninja-build xvfb libgl1-mesa-dri libgl1-mesa-dev libglx-mesa0 libegl1 mesa-utils libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libxcb-glx0 libxcb-xkb1 libxcb-xinput0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-render0 libx11-xcb1 libxcb1 libxkbcommon0
          python -m pip install --disable-pip-version-check aqtinstall ninja
          prefix="$RUNNER_TEMP/Qt/6.8.3/gcc_64"
          if [ ! -f "$prefix/lib/libQt6Quick.so" ]; then
            python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          fi
          test -f "$prefix/lib/libQt6Quick.so"
          echo "QT_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=$prefix/plugins/platforms" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$prefix/plugins" >> "$GITHUB_ENV"
      - name: Compile actual public GL PBO CaptureSource, Core and visible QSG test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/perf/tests/qt68_gl_pbo_source_r4 -B build-r4-gl-source -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$QT_PREFIX"
          cmake --build build-r4-gl-source --parallel 2
      - name: Real 4-quadrant GPU PBO to Core FrameStorage frames, stop and restart
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QSG_RHI_BACKEND: opengl
          QSG_RENDER_LOOP: ${{ matrix.loop }}
        run: |
          set -euo pipefail
          mkdir -p tmp/r4-source
          timeout 60s xvfb-run -a -s '-screen 0 1920x1080x24 +extension GLX' ./build-r4-gl-source/hyremote-qt68-gl-pbo-source-r4 | tee tmp/r4-source/$QSG_RENDER_LOOP.jsonl
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          log = Path("tmp/r4-source/" + os.environ["QSG_RENDER_LOOP"] + ".jsonl").read_text()
          assert "R4_VERDICT=PASS_SCOPED_CAPTURE_SOURCE" in log, log
          rows = [x.partition("=")[2] for x in log.splitlines() if x.startswith("R4_RESULT_JSON=")]
          assert len(rows) == 1, rows
          r = json.loads(rows[0])
          assert r["qt"] == "6.8.3" and r["backend"] == "Qt6_RHI_OpenGL", r
          assert r["phases_expected"] == r["owned_frames_validated"] == r["unique_request_ids"] == 12, r
          assert r["stop_restart_cycles"] == 1 and r["late_callbacks_after_stop"] == r["errors"] == 0, r
          assert r["qualified_for_product"] is False, r
          print("R4_CAPTURE_SOURCE_RUNTIME_PIXEL_AND_LIFETIME=PASS_SCOPED", r)
          PY
      - name: Publish only source test JSON, not installation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-qt68-gl-real-source-${{ matrix.loop }}
          path: tmp/r4-source/*.jsonl
          if-no-files-found: warn
          retention-days: 10
