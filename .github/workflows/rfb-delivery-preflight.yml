name: RFB delivery preflight

on:
  pull_request:
    paths:
      - 'tests/preflight/rfb-delivery/**'
      - '.github/workflows/rfb-delivery-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfb-delivery-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delivery-candidates:
    name: ${{ matrix.name }} / TRLE + ZRLE candidates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Windows x86_64
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Provide preflight-only zlib dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ runner.os }}' -eq 'Windows') {
            vcpkg install zlib:x64-windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            sudo apt-get update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sudo apt-get install -y --no-install-recommends zlib1g-dev
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Configure, build and run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ runner.os }}' -eq 'Windows') {
            $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
            cmake -S tests/preflight/rfb-delivery -B build-rfb-delivery -A x64 `
              -DHYREMOTE_PREFLIGHT_WITH_ZRLE=ON `
              -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
              -DVCPKG_TARGET_TRIPLET=x64-windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build build-rfb-delivery --config Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & './build-rfb-delivery/Release/hyremote-rfb-delivery-preflight.exe' 2>&1 | Tee-Object -FilePath rfb-delivery-trle.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & './build-rfb-delivery/Release/hyremote-rfb-zrle-preflight.exe' 2>&1 | Tee-Object -FilePath rfb-delivery-zrle.log
          } else {
            cmake -S tests/preflight/rfb-delivery -B build-rfb-delivery -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DHYREMOTE_PREFLIGHT_WITH_ZRLE=ON
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build build-rfb-delivery
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & './build-rfb-delivery/hyremote-rfb-delivery-preflight' 2>&1 | Tee-Object -FilePath rfb-delivery-trle.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & './build-rfb-delivery/hyremote-rfb-zrle-preflight' 2>&1 | Tee-Object -FilePath rfb-delivery-zrle.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evidence summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path rfb-delivery-trle.log)) {
            Write-Error 'TRLE preflight transcript is missing'
          }
          if (-not (Test-Path rfb-delivery-zrle.log)) {
            Write-Error 'ZRLE preflight transcript is missing'
          }

          $trle = Get-Content rfb-delivery-trle.log
          $zrle = Get-Content rfb-delivery-zrle.log
          Add-Content $env:GITHUB_STEP_SUMMARY "## RFB delivery preflight — ${{ matrix.name }}"
          Add-Content $env:GITHUB_STEP_SUMMARY '### TRLE'
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          ($trle | Where-Object { $_ -match '^(CASE=|TRLE_RAW_CPIXEL_BOUND=|PREFLIGHT_RESULT=)' }) |
            ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY $_ }
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Add-Content $env:GITHUB_STEP_SUMMARY '### ZRLE'
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          ($zrle | Where-Object { $_ -match '^(ZLIB_VERSION=|CASE=|PERSISTENT_STREAM_ORDER=|ZRLE_RAW_CPIXEL_BOUND=|PREFLIGHT_RESULT=)' }) |
            ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY $_ }
          Add-Content $env:GITHUB_STEP_SUMMARY '```'

          if (-not ($trle -contains 'TRLE_RAW_CPIXEL_BOUND=PASS')) {
            Write-Error 'TRLE raw-CPIXEL structural bound did not pass'
          }
          if (-not ($trle -contains 'PREFLIGHT_RESULT=PASS')) {
            Write-Error 'TRLE delivery preflight did not pass'
          }
          if (-not ($zrle -contains 'PERSISTENT_STREAM_ORDER=PASS')) {
            Write-Error 'ZRLE persistent stream/order contract did not pass'
          }
          if (-not ($zrle -contains 'ZRLE_RAW_CPIXEL_BOUND=PASS')) {
            Write-Error 'ZRLE raw-CPIXEL structural bound did not pass'
          }
          if (-not ($zrle -contains 'PREFLIGHT_RESULT=PASS')) {
            Write-Error 'ZRLE delivery preflight did not pass'
          }
