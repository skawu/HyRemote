name: Declarative QML example E2E

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'qml/**'
      - 'remoteaccess/**'
      - 'examples/qml-basic/**'
      - 'tests/product-e2e/qml_product_fit.py'
      - '.github/workflows/qml-example-e2e.yml'
  workflow_dispatch:

jobs:
  qml-product-fit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / Qt 6.8.3 / qml-basic / vncdotool
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / Qt 6.8.3 / qml-basic / vncdotool
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt, Ninja and viewer client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja vncdotool pillow
          aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"

      - name: Configure, build and E2E — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}" \
            -DHYREMOTE_BUILD_CORE=ON \
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON \
            -DHYREMOTE_BUILD_QML_API=ON \
            -DHYREMOTE_BUILD_EXAMPLES=ON \
            -DHYREMOTE_BUILD_TESTS=ON \
            -DHYREMOTE_BUILD_SPIKES=OFF
          cmake --build build --parallel
          python tests/product-e2e/qml_product_fit.py --qml build/examples/qml-basic/hyremote-qml-basic

      - name: Configure, build and E2E — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%QT_PREFIX%\bin;%PATH%"
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DHYREMOTE_BUILD_CORE=ON ^
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON ^
            -DHYREMOTE_BUILD_QML_API=ON ^
            -DHYREMOTE_BUILD_EXAMPLES=ON ^
            -DHYREMOTE_BUILD_TESTS=ON ^
            -DHYREMOTE_BUILD_SPIKES=OFF
          cmake --build build --parallel
          python tests\product-e2e\qml_product_fit.py --qml build\examples\qml-basic\hyremote-qml-basic.exe
