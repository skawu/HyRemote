name: RemoteAccess facade

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/core/**'
      - 'src/cpp/**'
      - '.github/scripts/install-linux-qt-desktop-deps.sh'
      - '.github/workflows/remoteaccess-facade.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 / Qt 6.8.3 / shared facade
            os: windows-2022
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - name: Linux x86_64 / Qt 6.8.3 / shared facade
            os: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt and Ninja
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt "${{ matrix.aqt_host }}" desktop 6.8.3 "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"

      - name: Install Linux Qt desktop host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/install-linux-qt-desktop-deps.sh

      - name: Configure, build and test — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}"

          # #198 fail-closed proof: an explicit request for transport security must never
          # produce a build that silently lacks OpenSSL. Disable package discovery
          # deterministically even on a hosted image that already has OpenSSL installed.
          if cmake -S . -B build-security-missing -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHYREMOTE_WITH_TRANSPORT_SECURITY=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE \
            > security-missing-openssl.log 2>&1; then
            cat security-missing-openssl.log
            echo "ERROR: transport-security configure unexpectedly succeeded without OpenSSL"
            exit 1
          fi
          grep -F "HYREMOTE_WITH_TRANSPORT_SECURITY=ON requires OpenSSL" security-missing-openssl.log

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHYREMOTE_BUILD_CORE=ON \
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON \
            -DHYREMOTE_BUILD_TESTS=ON \
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          test -f build/remoteaccess/libHyRemoteRemoteAccess.so
          LD_LIBRARY_PATH="$PWD/build/remoteaccess:$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
            ctest --test-dir build --output-on-failure

          # #164 release-surface proof. Tests intentionally receive private factory exports so
          # they can replace composition seams; a real release-like build must not. Build the same
          # runtime with tests disabled and inspect the actual dynamic symbol table rather than
          # relying on source convention alone.
          cmake -S . -B build-export-surface -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHYREMOTE_BUILD_CORE=ON \
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON \
            -DHYREMOTE_BUILD_TESTS=OFF \
            -DHYREMOTE_BUILD_SPIKES=OFF \
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build-export-surface --target hyremote-remoteaccess --parallel
          nm -D -C --defined-only build-export-surface/remoteaccess/libHyRemoteRemoteAccess.so \
            > remoteaccess-exports.txt
          grep -F "HyRemote::RemoteAccess::" remoteaccess-exports.txt
          for symbol in createTargetComponents createDefaultTransport setTargetFactory setTransportFactory resetFactories; do
            if grep -Fq "$symbol" remoteaccess-exports.txt; then
              echo "ERROR: source-private test factory leaked from release runtime: $symbol"
              cat remoteaccess-exports.txt
              exit 1
            fi
          done
          # Frozen one-runtime QPA architecture needs exactly these source-private bridge entry
          # points across the module/shared-library boundary. They are not installed headers or
          # application contracts; checking their presence makes the exception explicit and bounded.
          for symbol in createWritableCpuFrame writableCpuFrameOf mapPointerToNormalizedTarget; do
            grep -F "$symbol" remoteaccess-exports.txt
          done

      - name: Configure, build and test — Windows / MSVC x64
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "QT_PREFIX=%RUNNER_TEMP%\Qt\6.8.3\${{ matrix.qt_dir }}"
          set "PATH=%QT_PREFIX%\bin;%PATH%"

          rem #198 fail-closed proof, with FindOpenSSL disabled even if the hosted image provides it.
          cmake -S . -B build-security-missing -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DHYREMOTE_WITH_TRANSPORT_SECURITY=ON ^
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE > security-missing-openssl.log 2>&1
          if not errorlevel 1 (
            type security-missing-openssl.log
            echo ERROR: transport-security configure unexpectedly succeeded without OpenSSL
            exit /b 1
          )
          findstr /C:"HYREMOTE_WITH_TRANSPORT_SECURITY=ON requires OpenSSL" security-missing-openssl.log >nul
          if errorlevel 1 (
            type security-missing-openssl.log
            echo ERROR: expected fail-closed diagnostic was not emitted
            exit /b 1
          )

          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DHYREMOTE_BUILD_CORE=ON ^
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON ^
            -DHYREMOTE_BUILD_TESTS=ON ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          if not exist "%CD%\build\remoteaccess\HyRemoteRemoteAccess.dll" exit /b 1
          set "PATH=%CD%\build\remoteaccess;%QT_PREFIX%\bin;%PATH%"
          ctest --test-dir build --output-on-failure

          rem #164 release-surface proof, equivalent to the Linux nm check above.
          cmake -S . -B build-export-surface -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%" ^
            -DHYREMOTE_BUILD_CORE=ON ^
            -DHYREMOTE_BUILD_REMOTE_ACCESS=ON ^
            -DHYREMOTE_BUILD_TESTS=OFF ^
            -DHYREMOTE_BUILD_SPIKES=OFF ^
            -DHYREMOTE_BUILD_EXAMPLES=OFF
          cmake --build build-export-surface --target hyremote-remoteaccess --parallel
          dumpbin /EXPORTS "%CD%\build-export-surface\remoteaccess\HyRemoteRemoteAccess.dll" > remoteaccess-exports.txt
          findstr /C:"RemoteAccess@HyRemote" remoteaccess-exports.txt >nul
          if errorlevel 1 (
            type remoteaccess-exports.txt
            echo ERROR: public RemoteAccess ABI was not found in the release runtime
            exit /b 1
          )
          for %%S in (createTargetComponents createDefaultTransport setTargetFactory setTransportFactory resetFactories) do (
            findstr /C:"%%S" remoteaccess-exports.txt >nul
            if not errorlevel 1 (
              type remoteaccess-exports.txt
              echo ERROR: source-private test factory leaked from release runtime: %%S
              exit /b 1
            )
          )
          for %%S in (createWritableCpuFrame writableCpuFrameOf mapPointerToNormalizedTarget) do (
            findstr /C:"%%S" remoteaccess-exports.txt >nul
            if errorlevel 1 (
              type remoteaccess-exports.txt
              echo ERROR: required bounded QPA runtime bridge is missing: %%S
              exit /b 1
            )
          )
