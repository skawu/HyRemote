name: Third-party Qt-version substrate

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 3'
  pull_request:
    branches:
      - feature/104-v1-ga-acceptance-matrix
      - develop
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'integrations/qml/**'
      - 'integrations/qpa/**'
      - 'tests/third_party/**'
      - 'tools/third_party/**'
      - '.github/workflows/third-party-qt-matrix.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-api-forward-build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt }} / QPA=${{ matrix.qpa }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt: 6.8.3
            host: windows
            arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            qpa: ON
          - os: ubuntu-24.04
            qt: 6.8.3
            host: linux
            arch: linux_gcc_64
            qt_dir: gcc_64
            qpa: ON
          - os: windows-2022
            qt: 6.10.3
            host: windows
            arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            qpa: OFF
          - os: ubuntu-24.04
            qt: 6.10.3
            host: linux
            arch: linux_gcc_64
            qt_dir: gcc_64
            qpa: OFF
          - os: windows-2022
            qt: 6.11.2
            host: windows
            arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            qpa: OFF
          - os: ubuntu-24.04
            qt: 6.11.2
            host: linux
            arch: linux_gcc_64
            qt_dir: gcc_64
            qpa: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt and Ninja
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall ninja
          aqt install-qt "${{ matrix.host }}" desktop "${{ matrix.qt }}" "${{ matrix.arch }}" --outputdir "$RUNNER_TEMP/Qt"
      - name: Install Linux Qt desktop host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/install-linux-qt-desktop-deps.sh
      - name: Configure public API compatibility build
        shell: bash
        run: |
          QT_PREFIX="$RUNNER_TEMP/Qt/${{ matrix.qt }}/${{ matrix.qt_dir }}"
          cmake -S . -B build-third-party-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHYREMOTE_BUILD_QML_API=ON \
            -DHYREMOTE_BUILD_TESTS=OFF \
            -DHYREMOTE_BUILD_EXAMPLES=ON \
            -DHYREMOTE_WITH_QPA_PROXY=${{ matrix.qpa }}
          cmake --build build-third-party-qt --parallel
      - name: Re-assert matrix contract
        run: python tools/third_party/validate_matrix.py
