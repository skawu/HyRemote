[package]
name = "hyremote-vnc-rust-ffi-probe"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "hyremote_vnc_rust_ffi_probe"
crate-type = ["cdylib"]

[dependencies]
# Product-fit spike only: upstream rustvncserver PR #29 adds listen_on(SocketAddr).
# This is deliberately pinned to the PR commit so the spike can validate explicit loopback bind
# without pretending that v2.2.1 already contains the API. Production selection remains blocked
# until the capability is available from an accepted upstream/release path.
rustvncserver = { git = "https://github.com/shkolnik/rustvncserver", rev = "da3c35467c424639be56e09fdeb983e93ac609cb" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
