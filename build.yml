# HyRemote 仓库构建配置。
#
# 为什么需要这个文件：
#   日常构建、测试、安装、交叉编译的目标平台和 Qt 前缀应固定在本文件中，
#   而不是每次在命令行重复一长串 --qt-prefix、--toolchain、--cmake 参数。
#   build.cmd 只负责执行；临时实验才用命令行覆盖。
#
# 优先级：
#   内置默认值 < 本文件 < build.cmd 命令行参数
#
# 常用命令：
#   build.cmd build        读取本文件并构建
#   build.cmd test         构建并运行测试
#   build.cmd install      生成 build/install/ SDK 与产品树
#   build.cmd rebuild      清理后重新构建
#   build.cmd build --show-config
#                          只打印最终配置，不执行构建
#
# 需要切换一套完整配置时，复制本文件为独立 profile，例如 build.aarch64.yml，
# 然后执行：
#   build.cmd build --config=build.aarch64.yml
# 这样命令行仍然只有一个参数，平台差异留在 profile 文件中。
#
# 示例约定：每项后面的“示例”只是说明可选值，不是当前生效值。
#
# 交叉编译时只选一种配置方式，不要同时配置：
#
#   1. 推荐：compiler.toolchain 指向 CMake toolchain 文件（仓库自带或项目自定义），
#      qt.prefix 指向目标 Qt，compiler.c/cxx 留空。
#      这是 CMake 惯例，toolchain 文件负责编译器、sysroot 和 find-root 模式。
#
#   2. 使用 Qt 自带的交叉工具链：
#      compiler.toolchain 指向目标 Qt 的 qt.toolchain.cmake，
#      qt.prefix 留空或指向同一个目标 Qt，compiler.c/cxx 留空。
#
#   3. 只有没有 toolchain 文件时，才用 compiler.c/cxx 直接指定编译器；
#      还必须自行提供 sysroot 和 CMAKE_FIND_ROOT_PATH 设置，不推荐作为常规方式。
#
#   compiler.c/cxx 与 compiler.toolchain 同时配置会让显式编译器覆盖 toolchain
#   的结果，容易丢失 sysroot/find-root 配置，因此不要混用。
version: 1  # 示例：1

build:
  # 构建类型。
  # 示例：Release、Debug、RelWithDebInfo。
  type: Release
  # 构建目录。项目只使用一个 build/，不要为不同模式创建多个目录。
  # 示例：build、build-debug。
  directory: build
  # CMake 生成器。
  # 示例：Ninja、Visual Studio 17 2022、Unix Makefiles。
  generator: Ninja
  # 并行任务数；auto 表示交给构建系统决定。
  # 示例：auto、4、8。
  jobs: auto
  # 是否构建 examples。
  # 示例：true、false。
  examples: true

qt:
  # 留空时使用环境中的 QTDIR / CMAKE_PREFIX_PATH。
  # 本机示例：
  #   Windows: C:/Qt/6.8.3/msvc2022_64
  #   Linux:   /opt/Qt/6.8.3/gcc_64
  # 交叉编译示例：
  #   /opt/qt-6.8.3-aarch64
  # 不能填写主机 Qt；QPA proxy 依赖目标 Qt 的私有 ABI。
  # 使用 Qt 自带 qt.toolchain.cmake 时，此值可留空或与 toolchain 指向同一个目标 Qt。
  prefix: ""

compiler:
  # 高级回退项：仅在没有 toolchain 文件时直接指定目标编译器。
  # 已配置 compiler.toolchain 时请留空，否则显式值可能覆盖 toolchain 配置。
  # c 示例：C:/toolchains/arm-gnu/bin/aarch64-none-linux-gnu-gcc.exe
  c: ""
  # cxx 示例：C:/toolchains/arm-gnu/bin/aarch64-none-linux-gnu-g++.exe
  cxx: ""
  # 交叉编译工具链文件。相对路径相对于仓库根目录；这是推荐的交叉编译方式。
  # 仓库示例：cmake/toolchains/aarch64-linux-gnu.cmake
  # 仓库示例：cmake/toolchains/arm-linux-gnueabihf.cmake
  # Qt 自带示例：/opt/qt-6.8.3-aarch64/bin/qt.toolchain.cmake
  toolchain: ""

# 四个并列的应用集成前端，共用同一个 Common Runtime。
# 任意一个前端都不会隐式打开另一个前端。
# 常用组合：
#   全部开发:     cpp: true,  qml: true,  generic: true, qpa: true
#   仅嵌入式 C++: cpp: true,  qml: false, generic: false, qpa: false
#   仅 QML:       cpp: false, qml: true,  generic: false, qpa: false
#   仅 QPA:       cpp: false, qml: false, generic: false, qpa: true
#   仅 Runtime:   四个都设为 false
integrations:
  # 示例：true、false。
  cpp: true
  # 示例：true、false。
  qml: true
  # 示例：true、false。
  generic: true
  # 示例：true、false。
  qpa: true

# 传输安全是 Common Runtime 能力，不是集成模式。
# 示例：true 启用 VNC Authentication，false 保持无认证访问。
transport:
  security: false

tests:
  # 是否构建测试。
  # 示例：true、false。
  build: false
  # build.cmd test 会同时构建并运行；单独 build 时通常保持 false。
  # 示例：true、false。
  run: false
  # 并行测试进程数；auto 表示交给 CTest。
  # 示例：auto、4、8。
  parallel: auto
  # 测试名排除正则。
  # 示例："rfb-listener-reachability|qpa-.*"
  exclude: ""
  # Linux 无显示器环境下由 CTest 启动 Xvfb。
  # 示例：true、false。
  xvfb: false

# 任何非结构性的 CMake cache 值都可以持久化在这里，
# 避免每次命令行重复 -DKEY=VALUE。
#
# 注意：
#   build.yml 已有专用字段的值不能再放到这里，例如 CMAKE_PREFIX_PATH、
#   CMAKE_TOOLCHAIN_FILE、HYREMOTE_BUILD_TESTS；应使用上面的 qt/compiler/tests 字段。
#   CMAKE_SYSROOT 只应在 toolchain 文件没有设置时填写；toolchain 已设置时不要重复。
#   CMAKE_PREFIX_PATH 也不要在 toolchain 已设置目标 Qt 时强行重复。
#
# 示例：
#   cmake:
#     HYREMOTE_DEFAULT_PORT: 5921
#     CMAKE_SYSROOT: /opt/aarch64-sysroot
#     HYREMOTE_TOOLCHAIN_PREFIX: /opt/gcc-arm/bin/aarch64-none-linux-gnu-
#     CMAKE_BUILD_TYPE: RelWithDebInfo
cmake:
  # 示例：5921、6000。
  HYREMOTE_DEFAULT_PORT: 5921

# 可选环境变量，会一致地应用到 configure/build/test。
# 示例：
#   env:
#     PKG_CONFIG_PATH: /opt/aarch64-sysroot/usr/lib/pkgconfig
#     QTDIR: /opt/qt-6.8.3-aarch64
#
# 交叉编译示例（编辑上面的字段，不要在这里重复定义）：
#   1. qt.prefix 指向目标 Qt 6.8.3；
#   2. compiler.toolchain 指向 cmake/toolchains/aarch64-linux-gnu.cmake；
#   3. cmake.CMAKE_SYSROOT 指向目标 sysroot；
#   4. 执行 build.cmd clean 后执行 build.cmd build。
#
# 完整交叉编译步骤见：
#   docs/guide/cross-compilation.md
#   cmake/toolchains/README.md
